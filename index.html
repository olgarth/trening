<style>
/* Layout: one column phone app, sticky top bar, fixed bottom tab bar, cards only for exercises and data blocks */

  --accent:#1F4FD8; --accent-ink:#FFFFFF; --accent-soft:#DDE5FB;
  --pr:#C8372B; --good:#1E7045; --warn:#8A5B00; --bad:#A93322;
  --good-soft:#DCEFE3; --warn-soft:#F6EBCF; --bad-soft:#F7DEDA;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Manrope",-apple-system,system-ui,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1012; --surface:#171A1D; --surface2:#21252A; --line:#2D3238;
  --fg:#ECEEEA; --muted:#A0A7AE; --faint:#6B727A;
  --accent:#7398FF; --accent-ink:#0A0F1C; --accent-soft:#1D2A4D;
  --pr:#FF6E61; --good:#55C98E; --warn:#E6B33F; --bad:#F2705C;
  --good-soft:#163222; --warn-soft:#3A2F12; --bad-soft:#3D1D18;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1012; --surface:#171A1D; --surface2:#21252A; --line:#2D3238;
  --fg:#ECEEEA; --muted:#A0A7AE; --faint:#6B727A;
  --accent:#7398FF; --accent-ink:#0A0F1C; --accent-soft:#1D2A4D;
  --pr:#FF6E61; --good:#55C98E; --warn:#E6B33F; --bad:#F2705C;
  --good-soft:#163222; --warn-soft:#3A2F12; --bad-soft:#3D1D18;
  color-scheme:dark;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.ptr,html.ptr body{overscroll-behavior-y:none}
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:60;transform:translate(-50%,-60px);opacity:0;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:999px;background:var(--surface);color:var(--fg);border:1px solid var(--line);box-shadow:0 4px 18px rgba(0,0,0,.18);font-size:14px;font-weight:600;pointer-events:none;white-space:nowrap}
#ptr.anim{transition:transform .22s ease,opacity .22s ease}
#ptr .ptr-i{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;border-radius:50%;background:var(--accent);color:#fff;font-size:14px;transition:transform .15s}
#ptr.arm .ptr-i{transform:rotate(180deg)}
/* v56.8: утримання за порогом - кільце заповнюється, тоді «Відпусти» */
#ptr.hold .ptr-i{background:conic-gradient(var(--accent) var(--hp,0%),color-mix(in srgb,var(--accent) 30%,transparent) 0)}
#ptr.arm{border-color:var(--accent);color:var(--accent)}
#ptr.run .ptr-i{animation:ptrspin .8s linear infinite}
#ptr.ok .ptr-i{background:var(--good)}#ptr.err .ptr-i{background:var(--bad)}
@keyframes ptrspin{to{transform:rotate(360deg)}}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,a,input,select,textarea,label,summary{touch-action:manipulation}
.sheet,.tm{overscroll-behavior:contain}
body.sheetopen{overflow:hidden}
body.kb nav.tabs{display:none}
body.kb .toast{bottom:calc(var(--kb,0px) + 12px)}
body.sheetopen .toast,body.tmopen .toast{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}
body.sheetopen .toast:not(:has(button)){pointer-events:none}
body.kb .sheet{bottom:var(--kb,0px);max-height:calc(var(--vvh,100vh) * .92)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
.topnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;min-height:40px;padding-top:4px;max-width:760px;margin-inline:auto;transition:box-shadow .15s}
.topnav .hback{grid-column:1;justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis}.topnav .mini{grid-column:2;max-width:56vw;overflow:hidden;text-overflow:ellipsis;font:700 16px var(--f-display);text-transform:uppercase;letter-spacing:.02em;opacity:0;transition:opacity .15s;white-space:nowrap;pointer-events:none}
.topnav .sub{grid-column:3;justify-self:end;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
body.hcol .topnav .mini{opacity:1}body.hcol .topnav{box-shadow:0 1px 0 var(--line)}
body.wide .topnav{max-width:1080px}
.top{display:block;padding-block:2px 10px;margin-inline:-2px}
.top h1{font-size:30px;line-height:1;text-transform:uppercase}
.topnav .hback{border:0;background:none;padding:6px 4px 6px 0;min-height:40px;font-weight:600;font-size:16px;color:var(--accent);white-space:nowrap}
#scrollPad{height:0}
details.acc{padding:0}details.acc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;min-height:52px}details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .acc-t{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.15;flex:0 1 auto;min-width:min-content;max-width:68%;overflow-wrap:normal;word-break:normal}details.acc>summary .acc-s{font-size:12.5px;color:var(--muted);text-align:right;margin-left:auto;min-width:min(30%,7.5em);overflow-wrap:break-word}
details.acc>summary::after{content:'';flex:none;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0 2px;transition:transform .15s}details.acc[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
details.acc>.acc-b{padding:0 14px 14px;border-top:1px solid var(--line);padding-top:12px}
.acc-b>.card{border:0;background:none;padding:0;border-radius:0}.acc-b>.card+.card{border-top:1px solid var(--line);padding-top:12px}
details.hlp{margin:-2px 0 0}details.hlp>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--accent);min-height:30px}details.hlp>summary::-webkit-details-marker{display:none}
details.hlp>div{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:8px 10px;margin-top:2px;line-height:1.45}details.hlp[open]>summary{color:var(--muted)}
.zone{font-family:var(--f-display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 2px -6px}
.topnav .sub{color:var(--muted);font-size:13px;text-align:right}
main{display:flex;flex-direction:column;gap:14px;max-width:760px;margin-inline:auto;min-width:0}
.top{max-width:760px;margin-inline:auto}
body.wide main,body.wide .top{max-width:1080px}
@media (hover:hover){.btn:hover:not(:disabled){background:var(--surface2)}.btn.pri:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}.tpl:hover,.hrow:hover,.exrow:hover{border-color:var(--accent)}.chip:hover{border-color:var(--accent)}}
@media (min-width:900px){
 body.wide .tgroup,body.wide .hist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 body.wide .tgroup>.gh,body.wide .hist>.gh{grid-column:1/-1}
 body.wide .kpis{grid-template-columns:repeat(3,1fr)}
 .tm>*{width:100%;max-width:760px;margin-inline:auto}
 .tm>.tm-snd{width:auto}
 nav.tabs{grid-template-columns:repeat(5,minmax(0,140px));justify-content:center}
}
main>*{min-width:0;max-width:100%}
.card,.it,.hint,.prev,.it-meta,.kv{overflow-wrap:anywhere}
.tbl th,.tbl td{overflow-wrap:normal;word-break:normal}
.lbl{font-family:var(--f-display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:44px;padding:0 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.g2>.btn{padding:0 8px;letter-spacing:-.1px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.full{width:100%}
.btn:disabled{opacity:.4}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;font-size:16px;line-height:1;padding:0}
.ib:disabled{opacity:.3}
.ib.del{color:var(--bad)}
input.in,select.in{text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
.in,select.in,textarea.in{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 10px;font-size:16px;min-height:42px}
textarea.in{min-height:64px;resize:vertical}
input.in[type=date]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;text-align:left}
input.in[type=date]::-webkit-date-and-time-value{text-align:left}
.in::placeholder{color:var(--faint)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}.field input[type=range]{width:100%;margin:0;box-sizing:border-box}
.field>span{font-size:12px;color:var(--muted);font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px;overflow-x:auto}
.seg button{flex:1 0 auto;border:0;background:transparent;border-radius:9px;min-height:36px;padding:0 12px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips.per .chip{padding:0 10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:34px;padding:0 12px;font-size:14px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;line-height:1.2;text-align:center}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-acc{background:var(--accent-soft);color:var(--accent)} .p-mut{background:var(--surface2);color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:18px 8px;margin:0}

/* template picker */
.tgroup{display:flex;flex-direction:column;gap:8px}
.tpl{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:58px}
.tpl b{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.1;display:block}
.tpl small{color:var(--muted);font-size:12.5px}
.tpl .go{font-family:var(--f-display);font-size:22px;color:var(--accent)}

/* workout head */
.it.blk .brec .rtx{font-size:15px}
#set-volt button{white-space:normal;line-height:1.15;padding:5px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1 1 0;min-width:0}#set-volt button small{font-weight:500;font-size:12px}
.wk-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.wk-tags .chipb{display:inline-flex;align-items:center;gap:6px;min-height:36px;font:inherit;font-size:14px;text-align:left}.wk-tags .chipb .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}.wk-tags .chipb .k{color:var(--muted);font-weight:400;flex:none}.wk-tags .chipb .a{color:var(--muted);font-size:13px;flex:none}.wtl{flex:none}.wtl .tpk{align-items:flex-start}.wtl .tpk input{margin-top:1px}.wtl .tpk .n{white-space:normal}.tpk .wsub{display:block;font-size:12.5px;color:var(--muted);line-height:1.3;margin-top:1px}
.wk-name{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.05;text-transform:uppercase}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.metrics>.field>span:first-child{flex:1;display:flex;align-items:flex-end}
/* v56.5: поля в одному ряду - на одній лінії, незалежно від довжини підпису і підказки під полем (рядки: підпис / поле / підказка) */
@supports (grid-template-rows:subgrid){
 .metrics>.field,.g2>.field,.g3>.field{display:grid;grid-row:span 3;grid-template-rows:subgrid;row-gap:4px;align-content:start}
 .metrics>.field>:first-child,.g2>.field>:first-child,.g3>.field>:first-child{align-self:end}
 .metrics:has(>.field)>:not(.field),.g2:has(>.field)>:not(.field),.g3:has(>.field)>:not(.field){grid-row:span 3;align-self:end}
}
@media (min-width:520px){.metrics{grid-template-columns:repeat(4,1fr)}}

/* exercise card */
.it{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.it-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.it-name{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.15;min-width:0}
button.it-name{border:0;background:none;padding:2px 0;margin:0;text-align:left;color:inherit;display:flex;align-items:baseline;gap:0;cursor:pointer;flex:1}
.it-name .chev{display:inline-block;width:14px;color:var(--muted);font-size:18px;transition:transform .15s;transform:rotate(90deg);flex:none;margin-right:2px}button.it-name[aria-expanded=false] .chev{transform:none}
.it.col{gap:6px;padding-block:10px}.it-sum{display:flex;flex-direction:column;gap:2px;padding-left:16px}.it-sum .pill{margin-left:6px}
.chipb{border:1px solid var(--line);background:var(--surface2);border-radius:8px;font-size:14px;padding:4px 8px;color:var(--fg);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibi{border:0;background:none;color:var(--accent);font-size:17px;padding:2px 4px;min-height:28px}
.sechd{border:0;background:none;padding:0;display:flex;align-items:center;gap:2px;color:inherit;text-align:left;min-height:28px}.sechd .chev{display:inline-block;width:14px;color:var(--muted);font-size:16px;transition:transform .15s;transform:rotate(90deg)}.sechd[aria-expanded=false] .chev{transform:none}
.tsw{align-self:flex-start;padding:0 2px;min-height:26px;font-size:13px;margin-top:-4px}
.colall{display:flex;justify-content:flex-end;margin:-6px 0 -8px}
.it-name .n{color:var(--muted);margin-right:6px}
.it-name .nm,.wk-name,.tpl b,.hrow .t b{overflow-wrap:break-word;word-break:normal;hyphens:auto;-webkit-hyphens:auto}
@media (max-width:360px){.it-name{font-size:17px}}
.it-tools{display:flex;gap:4px;flex:none}.it-tools .ib{width:30px;height:30px;font-size:14px;border-radius:8px}
.it-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}
.it-meta .mgrp{display:inline-flex;align-items:center;gap:8px;max-width:100%;min-width:0}.it-meta .mgrp select{min-width:0}
.it-meta select{border:1px solid var(--line);background:var(--surface2);border-radius:8px;font-size:16px;padding:4px 6px;max-width:100%}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:600;color:var(--fg)}
.chk input{width:20px;height:20px;flex-shrink:0;accent-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:8px;padding:5px 9px}
.prev{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prev b{color:var(--fg);font-weight:600}
.sets{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:22px .9fr 1.15fr 1.15fr .8fr;gap:6px;align-items:center}
.srow.h{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.srow.h>span,.srow.h>button{text-align:center;justify-self:center}/* v57.6: заголовки по центру над клітинками */
.srow.h4{grid-template-columns:22px 1fr 1fr 1fr 1fr}

.dseg .sug{outline:2px dashed var(--accent);outline-offset:-4px}
:root{--ori:#94531A}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ori:#E0A35E}}
:root[data-theme=dark]{--ori:#E0A35E}
.cell.ori::placeholder{color:var(--ori);opacity:1}.hint.ori b{color:var(--ori)}
.glv{font-weight:700;font-size:13px;min-height:16px}.glv:empty{display:none}
/* v56.6: кольори оцінок Garmin для тексту - окремо для світлої і темної теми, контраст ≥ 4,5 (смужка біля поля - яскравий GCOL) */
:root{--g-red:#B42318;--g-orange:#8A5B00;--g-green:#1E7045;--g-blue:#155EA8;--g-purple:#7A3B96;--g-gray:#5B6068}

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function uid(){return Math.random().toString(36).slice(2,10)}
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const median=a=>{if(!a.length)return null;const b=a.slice().sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const todayStr=()=>iso(new Date());
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return iso(d)}
function addDays(s,n){const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)}

 ${hlp('Новий: «⚙ Власна вага 85%» під назвою - додаткова вага (2 гантелі, 1 гантель, жилет, допомога в кг) і гума (опір або допомога), у підходах лише потрібні клітинки. Частка × (вага тіла + те, що несеш) ± гума.<br>Старий: клітинка «+ Кг» і перемикач «+/−». Записані підходи не перераховуються.<br><b>Приклад:</b> болгарські, 80 кг, 2 гантелі по 12 кг: 85% × (80 + 24) ≈ 88 кг на робочу ногу.')}
 <div class="field"><span>Відпочинок</span><div class="seg">${[['off','Без'],['man','Вручну']].map(([k,l])=>`<button class="${rm===k?'on':''}" data-a="restm" data-v="${k}">${l}</button>`).join('')}</div></div>
 ${hlp(rm==='off'?'Колонки «Відп» немає. Відпочинок оцінюється з тривалості тренування, кількості повторів і темпу.<br><b>Приклад:</b> 55 хв, 160 повторів × 4 с ≈ 11 хв роботи → відпочинок і переходи ≈ 44 хв. Видно в підсумку і в «Динаміці». Вже записаний відпочинок не зникає.':'«Відп» - перша колонка: відпочинок <b>перед</b> підходом, вписуєш у тому ж рядку, коли записуєш підхід. У підході 1 - перерва між вправами (у першій вправі поля немає).<br><b>Приклад:</b> жим 1 - без відпочинку; 2 - «180»; 3 - «150». Присідання 1 - «240» (перерва після жиму).<br>Л/П: «Л» - перед лівою (між підходами), «П» - перед правою (між сторонами). В аналітику йде лише вписане.')}
 ${rm!=='off'?`<label class="field"><span>Стандартний відпочинок, с</span><input class="in" inputmode="numeric" data-f="set" data-k="restStd" id="set-reststd" value="${esc(S.settings.restStd??'')}" placeholder="180"></label>${restMode()!=='off'?`<label class="chk"><input type="checkbox" data-c="sett" data-k="restTimer" id="set-resttimer" ${S.settings.restTimer===true?'checked':''}>Таймер відпочинку між підходами</label>${hlp('Вписав повтори підходу - унизу з’являється смужка «Відпочинок 1:24 з 3:00». Коли час минув - сигнал і вібрація. Почав вписувати наступний підхід - фактичні секунди самі стають у його «Відп» (якщо там порожньо).<br><b>Приклад:</b> вписав 10 повторів, відпочив 2 хв 40 с, вписуєш наступний підхід - у «Відп» з’явиться 160.')}`:''}
 ${hlp('Сіра підказка в порожньому «Відп»: порожньо - 180, 0 - без підказки. Мають перевагу значення минулого разу і «Відпоч., с» з шаблону.<br><b>Приклад:</b> вписав 150 → сіре «150», а якщо минулого разу тут було 165 - «165».<br>Чому 180: понад 60 с трохи краще для росту, після 90 с різниці майже немає, у базових вправах 2-3 хв зберігають більше повторів.<br>Джерела: Singer et al., 2024.')}`:''}
 <label class="field"><span>Темп, с на повтор</span><input class="in" inputmode="decimal" data-f="set" data-k="tempo" id="set-tempo" value="${esc(S.settings.tempo??'')}" placeholder="4"></label>
 ${hlp('Секунд на повтор - для оцінки тривалості: робота = повтори × темп, решта - відпочинок і переходи (підсумок, «Динаміка»).<br>4 с - звичайний темп, повільно з паузами (3-1-3) - 6-7 с.<br><b>Приклад:</b> темп 4, 3 підходи по 10 → 2 хв роботи.')}`}
function sndHTML(){const cur=sndP();return`<div class="field"><span>Звук сигналу</span></div>${SNDS.map(([k,l,d])=>`<div class="sndrow"><label class="chk"><input type="radio" name="sndp" data-c="sndp" value="${k}" id="snd-${k}" ${cur===k?'checked':''}><span><b>${l}</b> <span class="muted small">${d}</span></span></label><button class="btn" data-a="snd-play" data-v="${k}" aria-label="Прослухати: ${l}">▶</button></div>`).join('')}
 ${hlp('Звук усіх сигналів таймера (3-2-1, старт, відпочинок, попередження, кінець - різні за висотою чи кількістю). ▶ програє «3-2-1 + старт».<br><b>Приклад:</b> музика в навушниках чи шумний зал → Різкий або Дзвіночок, м’які гірше чути.')}`}
function ivHTML(){return`<label class="field"><span>«Готуйся» перед стартом, розминкою і заминкою, с</span><input class="in" inputmode="numeric" data-f="set" data-k="prepS" id="set-preps" value="${esc(S.settings.prepS??'')}" placeholder="10"></label>
 ${hlp('Відлік перед розминкою, основною частиною і заминкою. 0 - без відліку.<br><b>Приклад:</b> 15 - встигнеш взяти гирю і стати на місце.')}
 <label class="field"><span>Сигнал перед кінцем відпочинку, с</span><input class="in" inputmode="numeric" data-f="set" data-k="ivPreS" id="set-ivpres" value="${esc(S.settings.ivPreS??'')}" placeholder="10"></label>
 ${hlp('Сигнал за N с до кінця відпочинку, 0 - вимкнено. Звучить, лише якщо відпочинок довший за N на 5+ с (щоб не злитися з 3-2-1).<br><b>Приклад:</b> відпочинок 30 с, сигнал 10 → на 20-й секунді, потім 3-2-1.')}
 <div class="lbl" style="margin-top:6px">Звук таймера</div>${sndHTML()}<label class="chk"><input type="checkbox" data-c="snd" id="set-snd" ${S.settings.sound!==false?'checked':''}>Звук у таймері (також перемикається на екрані таймера)</label>
 <label class="field"><span>Гучність сигналу: <b id="vol-v">${f0((num(S.settings.vol)||1)*100)}%</b></span><input type="range" min="30" max="100" step="5" data-f="vol" id="set-vol" value="${f0((num(S.settings.vol)||1)*100)}"></label>
 <label class="chk"><input type="checkbox" data-c="duck" id="set-duck" ${S.settings.duck!==false?'checked':''}>Приглушувати музику на час сигналу</label>
 <button class="btn" data-a="snd-test">Перевірити звук</button>
 <p class="muted small" style="margin:0">Сигнал не може бути гучнішим за загальну гучність ${AND?'телефона':'iPhone'}. Тому він різкий і високий, щоб пробиватися крізь музику, а музика на мить притихає${AND?'':' (Safari 16.4 і новіші)'}. Гучність 100% - максимум без спотворень.</p>`}
function mfHTML(){const W=warmOn();return`<div class="mft${W?'':' one'}"><span></span><span class="h">Силові</span>${W?'<span class="h">Зарядка</span>':''}
 ${MF.map(([k,l])=>`<span>${l}</span><input type="checkbox" data-c="mf" data-kind="str" data-k="${k}" id="mf-str-${k}" ${mfOn('str',k)?'checked':''} aria-label="${l}: силові">${W?(mornOn()&&(k==='sleep'||k==='bw')&&mornF(k)?'<span class="muted small" style="text-align:center">ранок</span>':`<input type="checkbox" data-c="mf" data-kind="warm" data-k="${k}" id="mf-warm-${k}" ${mfOn('warm',k)?'checked':''} aria-label="${l}: зарядка">`):''}`).join('')}</div>
 ${hlp('Вимкнене поле зникає із запису, аналітики і кореляцій, введене не стирається.<br><b>Відчуття навантаження</b> (sRPE) - твоя оцінка всього тренування наприкінці (1 - дуже легко, 10 - максимум), × тривалість = «навантаження».<br><b>Приклад:</b> важкість 7 × 60 хв = навантаження 420.')}`}
function anHTML(){return`${AN_DEF.map(([t,a],i)=>`<details class="anl" data-anl="${i}" ${(S.ui.anl||[]).includes(i)?'open':''}><summary><span>${t}</span><span class="muted small" style="font-weight:600;margin-left:auto">${a.filter(([k])=>anOn(k)).length} з ${a.length}</span></summary>${a.map(([k,l])=>`<label class="chk"><input type="checkbox" data-c="an" data-k="${k}" id="an-${k}" ${anOn(k)?'checked':''}>${l}</label>`).join('')}</details>`).join('')}
 ${hlp('Вимкнене тут лише ховається з «Аналітики», дані не змінюються.')}
 <div class="field"><span>Вага непрямих підходів (аналітика і відновлення)</span><div class="seg"><button class="${secW()===1?'on':''}" data-a="secw" data-v="1">×1</button><button class="${secW()===0.5?'on':''}" data-a="secw" data-v="0.5">×0,5</button></div></div>
 ${hlp('Як рахувати непрямі підходи в «Разом»: <b>×1</b> - як прямі, <b>×0,5</b> - як половину (типово: так найкраще пояснюється ріст м’язів у мета-аналізі).<br><b>Приклад:</b> 6 підходів жиму = 6 непрямих трицепсу: ×1 → «Разом» 6, ×0,5 → 3.<br>Джерела: Pelland et al., 2024.')}`}
function profHTML(){const T=S.settings.trx;
 return`<div class="g2"><label class="field"><span>Зріст, см</span><input class="in" inputmode="numeric" data-f="trx" data-k="height" id="trx-h" value="${esc(T.height)}"></label><label class="field"><span>Довжина ступні, см</span><input class="in" inputmode="decimal" data-f="trx" data-k="foot" id="trx-f" value="${esc(T.foot)}"></label></div>
 ${hlp('Зріст і ступня потрібні для TRX: з них рахується кут тіла і рівень.')}
 <label class="field"><span>Вага тіла, кг</span><input class="in" inputmode="decimal" data-f="set" data-k="bw" id="set-bw" value="${esc(S.settings.bw)}"><span class="muted small" id="src-bw">${profSrc('bw')}</span></label>
 ${hlp('Вага тіла для вправ з власною вагою. Найновіше тренування з вагою оновлює її тут (правка старого - ні). Тренування без ваги бере останню відому на свою дату (з тренування або звідси, що новіше).<br><b>Приклад:</b> 20.10 - 86 кг, 23.10 ваги не вписав → 23.10 рахується з 86 кг.')}
 <label class="field"><span>Рік народження</span><input class="in" inputmode="numeric" data-f="set" data-k="profBy" id="set-by" value="${esc(S.settings.profBy??'')}" placeholder="напр. 1988"></label><div class="field"><span>Стаж силових</span><div class="seg">${[[0,'не вказано'],[1,'до 1 р.'],[2,'1-3 р.'],[3,'3+ р.']].map(([v,l])=>`<button class="${(num(S.settings.profExp)||0)===v?'on':''}" data-a="kset" data-k="profExp" data-v="${v}">${l}</button>`).join('')}</div></div>
 ${hlp('Лише для коефіцієнта відновлення груп: вік 35-50 ×1,05, 50-65 ×1,15, 65+ ×1,25; стаж до 1 року ×1,2, 1-3 роки ×1,1. Не вказано - ×1. За дослідженнями до 50 років відновлення сповільнюється мало (Fernandes 2025, Gordon 2017), стаж важить більше за вік. Ще множники: sRPE того тренування (≤5 ×0,9, 8+ ×1,15) і «Мій запас відновлення» нижче.')}
 <label class="field"><span>Поточна фаза харчування</span>${phaseSel(S.settings.phase||'','setphase','set-phase')}<span class="muted small" id="src-phase">${profSrc('phase')}</span></label>
 ${hlp('Ставиться в кожне нове тренування. Змінив фазу в тренуванні - вона стає поточною тут (як і вага).')}`}
function profSub(){const T=S.settings.trx,a=[];if(num(T.height))a.push(esc(T.height)+' см');if(num(S.settings.bw))a.push(nf(num(S.settings.bw),1)+' кг');if(S.settings.phase)a.push((PHASES[S.settings.phase]||'').toLowerCase());return a.join(' · ')||'не заповнено'}
function vSet(){const t=S.settings.theme,sy=syState(),rm=restMode();const SQ=setSrchOn()?`<div class="sqw"><input class="in" type="search" id="setq" placeholder="Пошук налаштувань" value="${esc(S.ui.setq||'')}" autocomplete="off" aria-label="Пошук налаштувань"></div><p class="empty" id="setq-empty" hidden>Нічого не знайдено. Спробуй інше слово.</p>`:'';
 const nOn=MF.filter(([k])=>mfOn('str',k)).length;
 const look=`<label class="chk"><input type="checkbox" data-c="sett" data-k="setSrchOff" id="set-srch" ${setSrchOn()?'':'checked'}>Сховати пошук у Налаштуваннях</label>${hlp('Поле «Пошук налаштувань» вгорі цієї вкладки: шукає в назвах і поясненнях ⓘ і лишає лише відповідні рядки. Вимкни, якщо не потрібне.')}
 <div class="field"><span>Тема</span><div class="seg">${[['auto','Як у системі'],['light','Світла'],['dark','Темна']].map(([k,l])=>`<button class="${t===k?'on':''}" data-a="theme" data-v="${k}">${l}</button>`).join('')}</div></div>
 <div class="field"><span>Деталізація м’язів</span></div>${HL(`<div class="seg"><button class="${musFull()?'':'on'}" data-a="musmode" data-v="short">Коротко</button><button class="${musFull()?'on':''}" data-a="musmode" data-v="full">Детально</button></div><p class="muted small" style="margin:0">Діє скрізь: вибір м’язів у вправі, каталог вправ, аналітика, місячний звіт і зарядка.<br><b>Коротко</b> - 13 груп: груди, спина, трапеції, передня, середня і задня дельти, біцепс, трицепс, квадрицепс, сідниці, біцепс стегна, ікри, прес.<br><b>Детально</b> - окремі м’язи (груди верх/середина/низ, найширші, ромбоподібні, головки біцепса й трицепса, литковий і камбалоподібний тощо) плюс розгиначі спини, передпліччя, привідні.<br>Перемикання нічого не стирає: детальна розмітка вправ зберігається і в короткому режимі показується групами.</p>`)}`;
 const beh=`<label class="chk"><input type="checkbox" data-c="sett" data-k="cardFull" id="set-cardfull" ${S.settings.cardFull===true?'checked':''}>Повний вигляд картки вправи</label>${hlp('Типово картка простіша: ціль з шаблону - чипом, режим навантаження (штанга, гантелі, власна вага…), «Л/П окремо» і «Суперсет» - у меню ⋯, а колонка «Відп» не показується, коли працює таймер відпочинку (він сам записує секунди). Увімкни, щоб усе це було на картці, як раніше.')}<label class="chk"><input type="checkbox" data-c="sett" data-k="itArrows" id="set-itarrows" ${itArrows()?'checked':''}>Кнопки ↑ ↓ ✕ на картці вправи (замість меню ⋯)</label>${hlp('Типово переміщення, заміна і видалення вправи - у меню ⋯ в шапці картки: назва вправи займає більше місця.<br>Увімкни, щоб кнопки ↑ ↓ ✕ були на кожній картці, як раніше.')}<label class="chk"><input type="checkbox" data-c="sett" data-k="ssVis" id="set-ssvis" ${S.settings.ssVis!==false?'checked':''}>Суперсети показувати разом</label>${hlp('Вправи одного суперсету (трисету, гігантського сету) позначаються смугою зліва, а над групою - рядок «Суперсет A · 2 вправи». Тап по ньому згортає чи розгортає всю групу. На запис і відпочинок не впливає.')}<label class="chk"><input type="checkbox" data-c="sett" data-k="nextTpl" id="set-nexttpl" ${S.settings.nextTpl!==false?'checked':''}>Позначка «Далі» на шаблоні</label>${hlp('На екрані «Запис» у кожній групі шаблонів (Зал, Дім…) позначається той, що найдовше не виконувався, - щоб чергувати А і Б. Враховуються лише шаблони, які ти робив за останні 4 тижні: невиконані й давно покинуті не позначаються.')}<label class="chk"><input type="checkbox" data-c="sett" data-k="histEdit" id="set-histedit" ${S.settings.histEdit===true?'checked':''}>Тап в Історії одразу відкриває редагування</label>${hlp('Типово тап по тренуванню в Історії показує, що робив (вправи і підходи), а «Редагувати» - окрема кнопка. Увімкни, щоб, як раніше, одразу відкривалось редагування.')}${sheetTouchUI()?`<label class="chk"><input type="checkbox" data-c="sett" data-k="iosSheet" id="set-iossheet" ${S.settings.iosSheet!==false?'checked':''}>Закривати вікна свайпом униз і ✕</label>${hlp('Потягни вікно за верх униз - воно закриється, як від тапу поза ним. Кругла ✕ угорі з’являється лише там, де кнопку закриття не видно без прокрутки. Незбережені зміни не губляться: спершу попередження.')}`:''}<label class="chk"><input type="checkbox" data-c="sett" data-k="missChkOff" id="set-misschk" ${missOn()?'':'checked'}>Не попереджати про не повністю заповнені підходи</label>${hlp('Типово перед збереженням програма показує підходи, де щось уже вписано, але бракує повторів, кг, гуми чи однієї зі сторін Л/П, і порожні підходи між заповненими. «Повернутися» підсвічує такі клітинки червоним. Порожні підходи в кінці вправи (не виконав) не підсвічуються.')}<label class="chk"><input type="checkbox" data-c="sett" data-k="finChkOff" id="set-finchk" ${S.settings.finChk===false?'checked':''}>Не попереджати про вправи без підходів</label>${hlp('Типово перед збереженням програма попереджає, якщо якісь вправи лишились без підходів: вони не потраплять у запис.')}<div class="field"><span>Блок з таймером у тренуванні і шаблоні</span><div class="seg"><button class="${blkView()==='cards'?'on':''}" data-a="set-blkview" data-v="cards">Картки вправ</button><button class="${blkView()==='table'?'on':''}" data-a="set-blkview" data-v="table">Таблиця (як раніше)</button></div></div>${hlp('Картки: кожна вправа блоку окремою карткою, клітинки раундів під нею, вага і ціль - у вікні вправи. Таблиця: список вправ, «Налаштувати» і таблиця раундів. Дані ті самі. Зарядка - завжди таблицею.')}<label class="chk"><input type="checkbox" data-c="sett" data-k="colDef" id="set-coldef" ${S.settings.colDef!==false?'checked':''}>Вправи згорнуті за замовчуванням</label>${hlp('Картки вправ і «Перед тренуванням» (запис і шаблони) відкриваються згорнутими: назва, ціль або записані підходи.<br>Тап по назві - розгорнути. Нова вправа під час тренування - розгорнута.')}`;

 <details class="how"><summary>Блоки з таймером</summary><ul class="small">
  <li><b>Інтервали:</b> робота/відпочинок (30/20, 45/25 або свої) × раунди. Раунд = усі вправи блоку по черзі, між колами можна довший відпочинок.</li>
  <li><b>EMOM:</b> інтервал 0:30-3:00 або свій, усі вправи в кожному або по черзі. Невиконаний - «Не встиг».</li>
  <li><b>AMRAP:</b> максимум кіл за час, «+1 коло», наприкінці - зайві повтори.</li>
  <li><b>Кола:</b> задані кола на час, після кожного - «Коло завершено».</li>
  <li>Вправа: з повторами або на час; гиря, гантель, 2 гантелі, штанга, гума або без ваги. Прогрес - за назвою блоку, не змінюй її без потреби.</li>
  <li>Перед основною частиною - <b>відлік 10 с</b>, сигнали на останніх 3 с.</li>
  <li><b>Розминка і заминка</b> - системні вправи каталогу (не видаляються, назву й опис можна змінити) для будь-якого шаблону, тренування чи блоку з таймером, без ліміту часу.</li>

  <li>У силовому розминка і заминка - картки з секундоміром «Старт» / «Стоп», без таймера - хвилини вручну.</li>

 <details class="how"><summary>Регулювання за стандартом TRX</summary><ul class="small">
  <li><b>Кріплення</b> (якір) ≈ 1,83 м (6 футів) від підлоги.</li>
  <li><b>Лямки</b> - за жовтими мітками:
   <br><b>FS · Fully Shortened</b> - найкоротші (верхні мітки): тяги (Low Row тощо).
   <br><b>ML · Mid Length</b> - середина (подвійні мітки): стоячи, Y-підйоми.
   <br><b>MC · Mid Calf</b> - петлі на середині литки, 20-30 см від підлоги: на підлозі (планка, пайк, згинання ніг).
   <br><b>FL · Fully Lengthened</b> - найдовші, петлі ≈ 8 см від підлоги: жими й віджимання.</li>
  <li><b>Положення:</b> SF - стоячи обличчям до кріплення, SFA - спиною, SSW - боком; GF, GFA, GSW - те саме на підлозі.</li>
  <li><b>Важкість:</b> крутіший кут тіла (вектор) - важче, крок до кріплення чи від нього. Вужча опора (ноги разом, одна нога) - важче. Старт за точкою під кріпленням (маятник) полегшує, перед нею - ускладнює. Інтенсивність = опір + стабільність.</li>
  <li>«Стандарт TRX» рахує кут і кг з довжини лямок, висоти кріплення (стандарт або вручну), зросту і кроків. Висоти ручок орієнтовні: таблиця «Орієнтири» в Налаштуваннях → TRX, там заміряй свої і натисни «Перерахувати».</li>
  <li>Джерела: <a href="https://www.trxtraining.com/train/how-to-get-started-with-your-trx-suspension-trainer" target="_blank" rel="noopener">TRX: як почати</a>, <a href="https://www.trxtraining.com/train/when-to-shorten-and-length-the-trx-suspension-trainer" target="_blank" rel="noopener">TRX: коли вкорочувати й подовжувати</a>.</li></ul></details>
 <details class="how"><summary>Рівні TRX</summary><ul class="small">
  <li>Рівень 1-10 за кутом тіла, що горизонтальніше - то важче: 78°+ = 1, 70-77° = 2, 63-69° = 3, 55-62° = 4, 48-54° = 5, 40-47° = 6, 32-39° = 7, 22-31° = 8, менше 22° = 9, ноги на підвищенні +1.</li>
  <li>Тяги і жими: кг = вага тіла × 0,66 × cos(кут до підлоги): горизонтально ~66%, 45° ~47%, 60° ~33%, ноги на підвищенні ~70%. Похибка ±10-15%, але однакова, тож прогрес видно чесно.</li>
  <li>Кут береться з положення (висота кріплення, лямки FS/ML/MC/FL, ступні до точки опори або «лямки вертикально») у старті з прямими руками. Мінусові кроки - лише на турніку. Точність ±1 рівень, звір у «Рулетка» → «Рівень».</li>
  <li>Присідання, на одній нозі, випади: вага тіла × (1 − допомога рук): сильна ~40%, помірна ~25%, легка ~15%, лише баланс ~5%, без рук 0. У випадах передня нога ~85%. Точніше - підлогові ваги і кг вручну.</li>
  <li>Згинання ніг і підтягування колін - ручний рівень, без кг.</li>
  <li>Прогресія: повтори до верху діапазону → рівень +1 → знову з низу.</li>
  <li><b>Приклад:</b> 80 кг, тяга під 45° → 80 × 0,66 × cos 45° ≈ 37 кг, рівень 6.</li>
  <li>Джерела: Giancotti et al., 2021.</li></ul></details>
 <details class="how"><summary>Тренажери: як рахується навантаження</summary><ul class="small">
  <li>Вписуєш вагу, як на тренажері, програма рахує ефективну для обсягу, 1ПМ і звітів. Тип - кнопка ⚙ під назвою вправи.</li>
  <li><b>Блоковий:</b> стек × передавальне число. Верхній блок, тяга сидячи, стек з ексцентриком (розгинання/згинання ніг, «метелик») - 1:1, кросовер і функціональна рама - зазвичай 2:1, буває 4:1.</li>
  <li><b>Важільний:</b> диски × коефіцієнт + порожній тренажер. Реально ~0,6 - понад 1, типово 1,0 - впиши свій, якщо знаєш.</li>
  <li><b>На напрямних:</b> (диски + каретка) × sin(кута) × (1 − тертя). Гак-присід 45°: каретка 30 кг + 88% ваги тіла. Сміт: гриф ~15 кг, з противагою ~7. Каретки жиму ногами: Life Fitness 47 кг, Hammer Strength 54, Cybex 57, Matrix 76.</li>
  <li><b>Паралетси</b>: руки вище на ~12 см - на руки ~4% ваги тіла менше, але амплітуда глибша і вправа важча. В аналітиці окремо.</li>
  <li><b>Приклад:</b> жим ногами 45°, тертя 5% → ≈ 0,67: диски 100 + каретка 50 → ≈ 101 кг.</li></ul></details>
