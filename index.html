<title>Щоденник тренувань</title>

<style>
/* Layout: one column phone app, sticky top bar, fixed bottom tab bar, cards only for exercises and data blocks */
:root{
  --bg:#EFF1EE; --surface:#FFFFFF; --surface2:#E4E7E2; --line:#D3D7D0;
  --fg:#15181B; --muted:#5C636A; --faint:#9AA0A6;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --accent-soft:#DDE5FB;
  --pr:#C8372B; --good:#25804F; --warn:#B57A06; --bad:#BE3B2A;
  --good-soft:#DCEFE3; --warn-soft:#F6EBCF; --bad-soft:#F7DEDA;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Manrope",-apple-system,system-ui,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1012; --surface:#171A1D; --surface2:#21252A; --line:#2D3238;
  --fg:#ECEEEA; --muted:#A0A7AE; --faint:#6B727A;
  --accent:#7398FF; --accent-ink:#0A0F1C; --accent-soft:#1D2A4D;
  --pr:#FF6E61; --good:#55C98E; --warn:#E6B33F; --bad:#F2705C;
  --good-soft:#163222; --warn-soft:#3A2F12; --bad-soft:#3D1D18;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1012; --surface:#171A1D; --surface2:#21252A; --line:#2D3238;
  --fg:#ECEEEA; --muted:#A0A7AE; --faint:#6B727A;
  --accent:#7398FF; --accent-ink:#0A0F1C; --accent-soft:#1D2A4D;
  --pr:#FF6E61; --good:#55C98E; --warn:#E6B33F; --bad:#F2705C;
  --good-soft:#163222; --warn-soft:#3A2F12; --bad-soft:#3D1D18;
  color-scheme:dark;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,a,input,select,textarea,label,summary{touch-action:manipulation}
.sheet,.tm{overscroll-behavior:contain}
body.sheetopen{overflow:hidden}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:14px 10px;margin-inline:-2px}
.top h1{font-size:30px;line-height:1;text-transform:uppercase}
.top .sub{color:var(--muted);font-size:13px;text-align:right}
main{display:flex;flex-direction:column;gap:14px;max-width:760px;margin-inline:auto;min-width:0}
.top{max-width:760px;margin-inline:auto}
body.wide main,body.wide .top{max-width:1080px}
@media (hover:hover){.btn:hover:not(:disabled){background:var(--surface2)}.btn.pri:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}.tpl:hover,.hrow:hover,.exrow:hover{border-color:var(--accent)}.chip:hover{border-color:var(--accent)}}
@media (min-width:900px){
 body.wide .tgroup,body.wide .hist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 body.wide .tgroup>.gh,body.wide .hist>.gh{grid-column:1/-1}
 body.wide .kpis{grid-template-columns:repeat(3,1fr)}
 .tm>*{width:100%;max-width:760px;margin-inline:auto}
 nav.tabs{grid-template-columns:repeat(5,minmax(0,140px));justify-content:center}
}
main>*{min-width:0;max-width:100%}
.card,.it,.hint,.prev,.it-meta,.kv{overflow-wrap:anywhere}
.lbl{font-family:var(--f-display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:44px;padding:0 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.full{width:100%}
.btn:disabled{opacity:.4}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;font-size:16px;line-height:1;padding:0}
.ib:disabled{opacity:.3}
.ib.del{color:var(--bad)}
input.in,select.in,textarea.in{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 10px;font-size:16px;min-height:42px}
textarea.in{min-height:64px;resize:vertical}
input.in[type=date]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;text-align:left}
input.in[type=date]::-webkit-date-and-time-value{text-align:left}
.in::placeholder{color:var(--faint)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted);font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px;overflow-x:auto}
.seg button{flex:1 0 auto;border:0;background:transparent;border-radius:9px;min-height:36px;padding:0 12px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:34px;padding:0 12px;font-size:14px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;line-height:1.2;text-align:center}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-acc{background:var(--accent-soft);color:var(--accent)} .p-mut{background:var(--surface2);color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:18px 8px;margin:0}

/* template picker */
.tgroup{display:flex;flex-direction:column;gap:8px}
.tpl{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:58px}
.tpl b{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.1;display:block}
.tpl small{color:var(--muted);font-size:12.5px}
.tpl .go{font-family:var(--f-display);font-size:22px;color:var(--accent)}

/* workout head */
.wk-name{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.05;text-transform:uppercase}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:520px){.metrics{grid-template-columns:repeat(4,1fr)}}

/* exercise card */
.it{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.it-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.it-name{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.1;min-width:0}
.it-name .n{color:var(--faint);margin-right:6px}
.it-tools{display:flex;gap:6px;flex:none}
.it-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}
.it-meta select{border:1px solid var(--line);background:var(--surface2);border-radius:8px;font-size:16px;padding:4px 6px;max-width:100%}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:600;color:var(--fg)}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:8px;padding:5px 9px}
.prev{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prev b{color:var(--fg);font-weight:600}
.sets{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:22px 1.15fr 1.15fr .8fr .9fr;gap:6px;align-items:center}
.srow.h{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.srow.h4{grid-template-columns:22px 1fr 1fr 1fr 1fr}
.srow .i{font-family:var(--f-display);color:var(--faint);font-size:17px;text-align:center}
.cell{width:100%;min-width:0;height:42px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;text-align:center;font:600 18px var(--f-display);font-variant-numeric:tabular-nums;padding:0 2px}
.cell::placeholder{color:var(--faint);font-weight:500}
.lr{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.lr .cell{font-size:17px}
.bandbtn{height:42px;width:100%;min-width:0;border:1px solid var(--line);background:var(--surface2);border-radius:10px;display:flex;align-items:center;gap:5px;padding:0 6px;font-size:13px;font-weight:600;overflow:hidden}
.bandbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 1.5px var(--surface),0 0 0 2.5px var(--line)}
.it-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
.it-foot .stat{font-size:13px;color:var(--muted)}
.it-foot .stat b{font-family:var(--f-display);font-size:18px;color:var(--fg);font-weight:700}
.minibtns{display:flex;gap:6px}
.minibtns .btn{min-height:36px;padding:0 10px;font-size:14px}
.cf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cf .cell{height:44px}

/* history */
.hist{display:flex;flex-direction:column;gap:8px}
.hrow{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.hrow .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.hrow .t b{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.1}
.hrow .t span{color:var(--muted);font-size:13px;white-space:nowrap}
.kv{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.kv b{color:var(--fg);font-family:var(--f-display);font-size:16px;font-weight:600}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:520px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi .v{font:700 28px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:600}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600}
.sig{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.sig:first-child{border-top:0}
.sig .pill{flex:none;margin-top:1px}
.chart{position:relative;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;top:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:600;white-space:nowrap;transform:translateX(-50%)}
.ax{fill:var(--muted);font:500 11px var(--f-body)}
.gl{stroke:var(--line);stroke-width:1}
.cl-area{fill:var(--accent);opacity:.1}.cl-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.cl-dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}.chart .hl{stroke:var(--muted);stroke-dasharray:3 3}.chart .hp{fill:none;stroke:var(--fg);stroke-width:2}
.tblw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;font-weight:700;padding:6px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl tr[data-a]{cursor:pointer}
.up{color:var(--good);font-weight:700} .down{color:var(--bad);font-weight:700}
.gbar{display:grid;grid-template-columns:minmax(116px,42%) 1fr 56px;gap:8px;align-items:center;padding:5px 0}
.gbar .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:14px;background:var(--surface2);border-radius:7px;overflow:hidden}
.track .zone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--good) 16%,transparent)}
.track .fill{position:absolute;left:0;top:3px;bottom:3px;border-radius:4px;background:var(--fg)}
.gbar .vv{text-align:right;font:700 17px var(--f-display);font-variant-numeric:tabular-nums}
.gbar .vv small{display:block;font:600 10.5px var(--f-body);color:var(--muted)}
.corr{display:grid;grid-template-columns:1fr 70px;gap:4px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.corr:first-of-type{border-top:0}
.rbar{grid-column:1/-1;height:8px;background:var(--surface2);border-radius:4px;position:relative}
.rbar i{position:absolute;top:0;bottom:0;border-radius:4px}
.rbar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1.5px;background:var(--faint)}
.rep h3{font-size:22px}
.rep .sec{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}

/* templates editor */
.ti{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.ti .tn{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.1;background:none;border:0;padding:0;text-align:left;color:var(--fg)}
.exlist{display:flex;flex-direction:column}
.exrow{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 2px;min-height:48px}
.exrow:first-child{border-top:0}
.exrow small{color:var(--muted);font-size:12px;display:block}
.gh{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--muted);padding:12px 2px 2px}

/* band rows */
.bandrow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.bandrow:first-child{border-top:0}
.bandrow.on{background:var(--accent-soft);border-radius:10px;padding:10px;margin-inline:-4px}
.bandrow .l1{display:flex;gap:8px;align-items:center}
.bandrow input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;border-radius:50%;flex:none}
.bandrow .l2{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.bandrow .l2 .cell{width:68px;height:38px;font-size:16px}
.stepper{display:flex;align-items:center;gap:6px;flex:none}.stepper b{min-width:22px;text-align:center;font-size:20px}
.sheetfoot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--bg);padding:8px 0 calc(18px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-18px - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.bandtotal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.bandbtn .dot+.dot{margin-left:-8px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);min-height:50px;justify-content:center}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:18px 18px 0 0;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-width:720px;margin-inline:auto}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 2px}
.sheet h3{font-size:24px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--accent-soft);font-weight:700;text-decoration:underline}
details.how summary{font-weight:700;cursor:pointer}
/* HIIT blocks */
.mcard.done{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.wrow{display:flex;flex-direction:column;gap:6px;padding-top:8px;border-top:1px solid var(--line)}
.mname{font:600 20px/1.1 var(--f-display)}
.blk{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.bexl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.bgrid td{padding:4px}.bgrid .cell{min-width:52px}
.bgrid th{white-space:nowrap;max-width:84px;overflow:hidden;text-overflow:ellipsis;text-transform:none;letter-spacing:0;font-size:12px}
.bgrid td:first-child,.bgrid th:first-child{width:28px;text-align:center;vertical-align:middle}
.ivgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.iv{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:10px;padding:4px;background:var(--bad-soft)}
.iv.ok{background:var(--good-soft)}
.ivb{border:0;background:none;font:700 15px var(--f-display);min-height:30px;color:var(--fg)}
.iv .cell{height:36px;font-size:16px}
body.tmopen{overflow:hidden}
.tm{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;gap:10px;overflow-y:auto;
 padding:calc(14px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));background:var(--bg);color:var(--fg)}
.tm-work{background:var(--accent);color:var(--accent-ink)}
.tm-up{background:var(--accent);color:var(--accent-ink)}
.tm-rest{background:var(--good-soft);color:var(--fg)}
.tm-prep{background:var(--warn-soft);color:var(--fg)}
.tm-top{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:15px;opacity:.9}
.tm-phase{font:700 34px/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em;margin-top:6px}
.tm-dig{font:700 clamp(96px,32vw,190px)/.9 var(--f-display);font-variant-numeric:tabular-nums;text-align:center;margin:4px 0}
.tm-sub{text-align:center;font-weight:700;opacity:.85}
.tm-cur{text-align:center}
.tm-exn{font:700 30px/1.05 var(--f-display)}
.tm-exs{font-size:16px;opacity:.85;margin-top:2px}
.tm-nextl{font-size:13px;text-transform:uppercase;letter-spacing:.08em;opacity:.75;font-weight:700}
.tm-next{text-align:center;font-size:15px;opacity:.85}
.tm-list{text-align:left;margin:0 auto;max-width:420px;font:600 20px/1.35 var(--f-display);padding-left:24px}
.tm-list span{font:500 14px var(--f-body);opacity:.8}
.tm-extra{display:flex;flex-direction:column;gap:8px;align-items:center}
.tm-in{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600}
.tm-in .cell{width:120px;height:52px;font-size:26px;background:var(--surface);color:var(--fg)}
.tm .btn{background:color-mix(in srgb,var(--surface) 85%,transparent);color:var(--fg);border-color:transparent}
.tm .btn.danger{color:var(--bad)}
.tm-rd{min-height:56px;font-size:20px;min-width:64px}
.tm-rdbig{min-width:180px;font-size:22px}
.tm-miss.on{background:var(--bad-soft);color:var(--bad)}
.tm-ctl{margin-top:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.tm-ctl .btn{min-height:54px;font-size:17px}
.tm-snd{align-self:center;color:inherit}
.tm-snd input{accent-color:currentColor}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
.chip.mus-p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.mus-s{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.muslegend{display:flex;gap:6px}.muslegend .chip{min-height:26px;font-size:12px}
.musreg{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.gdet>summary{list-style:none;cursor:pointer}.gdet>summary::-webkit-details-marker{display:none}
.gdet[open]>summary .nm{color:var(--accent)}
.gsub{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);padding:3px 4px 3px 14px}
.gsub b{color:var(--fg);font-size:15px}
.warnbox{border-color:var(--warn);background:var(--warn-soft)}
.tm-big{font:700 40px var(--f-display);text-align:center}
.tm-sum{display:flex;flex-direction:column;gap:10px}
.tm-done .cell{background:var(--surface)}
details.how ol,details.how ul{padding-left:20px;margin:8px 0 0}
details.how{border-top:1px solid var(--line);padding-top:10px}
details.how:first-of-type{border-top:0;padding-top:0}
details.how summary{min-height:32px;display:list-item}
details.how li{margin-bottom:6px}
@media (prefers-reduced-motion:no-preference){.sheet:not(.noanim){animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

function imputed(w,k){const v=num(w[k]);if(v!=null)return{v,imp:false};const ws=sortedW();let pool=ws.filter(x=>x.id!==w.id&&x.date<=w.date&&num(x[k])!=null);if(!pool.length)pool=ws.filter(x=>x.id!==w.id&&num(x[k])!=null);if(!pool.length)return{v:null,imp:true};return{v:avg(pool.map(x=>num(x[k]))),imp:true}}
function bwOf(w){const r=imputed(w,'bw');return r.v!=null?r.v:num(S.settings.bw)}
function repsOf(it,s){if(it.uni){const l=num(s.rl),r=num(s.rr);if(l==null&&r==null)return null;return{tot:(l||0)+(r||0),per:l!=null&&r!=null?(l+r)/2:(l??r)}}const r=num(s.r);return r==null?null:{tot:r,per:r}}
const bandsOf=s=>s.bands&&s.bands.length?s.bands:(s.band?[s.band]:[]);
const bandMid=b=>((num(b.min)||0)+(num(b.max)||0))/2;
const BSTR={lo:['Слабкий',.25,'слабк.'],mid:['Середній',.5,''],hi:['Сильний',.8,'сильн.']};
const bandVal=(b,p)=>{const lo=num(b.min)||0,hi=num(b.max)||0;return lo+p*(hi-lo)};
const bandEach=(s,it)=>s.bmode==='each'&&!(it&&it.uni);
const bandKg=(s,it)=>{const a=bandsOf(s);if(!a.length)return null;const p=(BSTR[s.bstr]||BSTR.mid)[1];const v=a.reduce((t,b)=>t+bandVal(b,p),0);return bandEach(s,it)?v*2:v};
function bandLabel(a){if(!a.length)return'гума';const c={};a.forEach(b=>c[b.name]=(c[b.name]||0)+1);return Object.entries(c).map(([n,k])=>k>1?n+'×'+k:n).join('+')}
const LEVEL_ANG={1:82,2:73.5,3:66,4:58.5,5:51,6:43.5,7:35.5,8:27,9:12};
function trxFrac(s){const lv=num(s.w);if(s.pos&&s.pos.el)return .73;let ang=(s.ang!=null&&!s.man)?s.ang:(s.pos&&!s.man&&s.ang===null?85:LEVEL_ANG[lv]);if(lv>=10&&ang==null)return .73;if(ang==null)return null;return .69*Math.cos(ang*Math.PI/180)}
function unitOf(type,exId){return type==='trx'?(trxModeOf(exId)!=='manual'?'кг':'інд.'):E1UNIT[type]}
function baseLoad(it,s,bw){if(it.type==='trx'&&trxModeOf(it.exId)==='leg')return trxLegKg(it,s,bw);if(it.type==='trx'&&trxAngleMode(it)){const f=trxFrac(s);return f&&bw?bw*f:null}switch(it.type){case'weight':case'db1':case'db2':case'trx':return num(s.w);case'bw':return(bw||0)+(num(s.w)||0);case'band':return bandKg(s,it)}return null}
function volLoad(it,s,bw){if(it.type==='trx'&&trxModeOf(it.exId)==='manual')return null;const L=baseLoad(it,s,bw);if(L==null)return null;return it.type==='db2'?L*2:L}
function e1rm(L,reps,rir){if(!L||!reps)return null;const t=reps+(rir||0);return t<=1?L:L*(1+t/30)}
function setE1(it,s,bw){const R=repsOf(it,s);if(!R||!R.per)return null;return e1rm(baseLoad(it,s,bw),R.per,num(s.rir))}
function setVol(it,s,bw){const R=repsOf(it,s);if(!R)return 0;const L=volLoad(it,s,bw);return L?L*R.tot:0}
function isHard(it,s){if(!STR.includes(it.type))return false;const R=repsOf(it,s);if(!R||!R.tot)return false;const rir=num(s.rir);return rir==null||rir<=4}

function niceStep(r,n){const raw=r/Math.max(1,n);const p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function chart(pts,unit,dg=0){if(!pts.length)return`<p class="empty">Немає даних за цей період</p>`;
 const id='c'+uid(),W=340,H=176,L=42,R=12,Tp=12,B=26;

 const ys=pts.map(p=>p.y);let y0=Math.min(...ys),y1=Math.max(...ys);if(y0===y1){const pad=Math.abs(y0)*.1||1;y0-=pad;y1+=pad}
 const st=niceStep(y1-y0,3);y0=Math.floor(y0/st)*st;y1=Math.ceil(y1/st)*st;if(y0===y1)y1=y0+st;

 let g='';for(let v=y0;v<=y1+st/2;v+=st){const yy=Y(v).toFixed(1);g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L-6}" y="${(+yy+4).toFixed(1)}" text-anchor="end">${nf(v,st<1?1:0)}</text>`}

 const line=P.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
 const area=P.length>1?`<path class="cl-area" d="${line} L${P[P.length-1].x.toFixed(1)} ${H-B} L${P[0].x.toFixed(1)} ${H-B} Z"/>`:'';
 const lbls=[P[0]];if(P.length>2)lbls.push(P[Math.floor(P.length/2)]);if(P.length>1)lbls.push(P[P.length-1]);

function attachCharts(){for(const id in CH){const el=document.getElementById(id);if(!el)continue;const c=CH[id],svg=el.querySelector('svg'),tip=el.querySelector('.tip'),hl=el.querySelector('.hl'),hp=el.querySelector('.hp');

 ${up.length?`<div class="sec"><div class="lbl">Найбільший ріст</div>${up.slice(0,3).filter(p=>p.ch>0).map(p=>`<div class="row between"><span class="small">${esc(p.o.label)}</span><b class="up">${pct(p.ch)}</b></div>`).join('')||'<span class="muted small">Росту немає</span>'}</div>
 <div class="sec"><div class="lbl">Спад</div>${up.slice().reverse().slice(0,3).filter(p=>p.ch<0).map(p=>`<div class="row between"><span class="small">${esc(p.o.label)}</span><b class="down">${pct(p.ch)}</b></div>`).join('')||'<span class="muted small">Спаду немає</span>'}</div>`:'<p class="muted small" style="margin:0">Для прогресії потрібні ті самі вправи в попередні 60 днів.</p>'}
 <div class="sec"><div class="lbl">Підходи на тиждень по групах</div>${groupBars(R.groups,R.wk,R.mus)}</div>
 ${Object.keys(R.cardio).length?`<div class="sec"><div class="lbl">Кардіо</div>${Object.entries(R.cardio).map(([n,c])=>`<div class="row between small"><span>${esc(n)} ×${c.n}</span><span class="num">${f0(c.time)} хв${c.dist?' · '+f1(c.dist)+' км':''}${c.kcal?' · '+f0(c.kcal)+' ккал':''}</span></div>`).join('')}</div>`:''}
 ${R.morning.n&&warmOn()?`<div class="sec"><div class="lbl">Ранкова зарядка</div><div class="small">${R.morning.n} з ${R.morning.days} днів · найдовша серія ${R.morning.best}</div></div>`:''}
 ${R.hiit.n?`<div class="sec"><div class="lbl">HIIT</div><div class="small">${R.hiit.n} блоків / вправ · ${f1(R.hiit.work/60)} хв роботи${R.hiit.rounds?' · '+R.hiit.rounds+' раундів':''}${R.hiit.reps?' · '+R.hiit.reps+' повт.':''}</div></div>`:''}
 <button class="btn full" data-a="copy-rep">Скопіювати звіт текстом</button></section>`;
 return h}
function reportText(R){const L=[];L.push(`Звіт тренувань: ${MON[+R.ym.slice(5)-1]} ${R.ym.slice(0,4)}`);L.push(`Тренувань: ${R.ws.length} (${f1(R.ws.length/R.wk)}/тиж), робочих підходів: ${R.hard}, обсяг: ${f1(R.vol/1000)} т`);
 L.push(`Сон: ${f1(R.sl.v)} год, самопочуття: ${f1(R.wl.v)}, тривалість: ${f0(R.dur.v)} хв`);L.push(`Фаза харчування: ${phaseTxt(R.phases)}`);L.push(`Загальна прогресія 1ПМ: ${pct(R.idx)} (${R.prog.length} вправ)`);Object.entries(R.byPhase).forEach(([k,a])=>L.push(`  ${PHASES[k]}: ${pct(median(a))}`));
 Object.entries(R.byTag).forEach(([t,a])=>L.push(`  ${t}: ${pct(median(a))}`));
 R.prog.slice().sort((a,b)=>b.ch-a.ch).forEach(p=>L.push(`  ${p.o.label}: ${pct(p.ch)}`));
 L.push('Підходи на тиждень:');(musFull()?GROUPS.filter(g=>!MINOR.includes(g)||R.groups[g]):SHORT_GROUPS).forEach(g=>L.push(`  ${g}: ${nf((R.groups[g]||0)/R.wk,1)}`));
 Object.entries(R.cardio).forEach(([n,c])=>L.push(`Кардіо ${n}: ${c.n} разів, ${f0(c.time)} хв${c.dist?', '+f1(c.dist)+' км':''}`));
 if(R.morning.n&&warmOn())L.push(`Ранкова зарядка: ${R.morning.n} з ${R.morning.days} днів, найдовша серія ${R.morning.best}`);
 if(R.hiit.n)L.push(`HIIT: ${R.hiit.n} блоків / вправ, ${f1(R.hiit.work/60)} хв роботи${R.hiit.reps?', '+R.hiit.reps+' повт.':''}`);return L.join('\n')}

 let h=`<div class="seg"><button class="${sub==='t'?'on':''}" data-a="ttab" data-v="t">Шаблони</button><button class="${sub==='e'?'on':''}" data-a="ttab" data-v="e">Каталог вправ</button></div>`;

 const g={};S.templates.forEach(t=>{(g[t.tag||'Інше']=g[t.tag||'Інше']||[]).push(t)});

 return h}
function vTplEdit(t){let h=`<div class="row between"><button class="btn ghost" data-a="tpl-done">‹ Готово</button><div class="row"><button class="btn" data-a="tpl-dup" data-t="${t.id}">Копія</button><button class="btn danger" data-a="tpl-del" data-t="${t.id}">Видалити</button></div></div>
 <section class="card stack"><label class="field"><span>Назва</span><input class="in" data-f="tpl" data-k="name" id="tpl-name" value="${esc(t.name)}"></label>
 <div class="g2"><label class="field"><span>Місце / тип</span><select class="in" data-f="tpl" data-k="tag" id="tpl-tag">${TAGS.map(x=>`<option ${x===t.tag?'selected':''}>${x}</option>`).join('')}</select></label>
 <label class="field"><span>Примітка</span><input class="in" data-f="tpl" data-k="note" id="tpl-note" value="${esc(t.note)}" placeholder="Із собою: гуми"></label></div></section>`;
 h+=t.items.map((it,i)=>{if(it.kind==='block')return`<div class="ti blk"><div class="it-head"><button class="tn" data-a="tb-edit" data-n="${i}">${i+1}. ${esc(it.name)}</button><div class="it-tools"><button class="ib" data-a="ti-mv" data-d="-1" data-n="${i}" ${i===0?'disabled':''} aria-label="Вище">↑</button><button class="ib" data-a="ti-mv" data-d="1" data-n="${i}" ${i===t.items.length-1?'disabled':''} aria-label="Нижче">↓</button><button class="ib del" data-a="ti-del" data-n="${i}" aria-label="Видалити">✕</button></div></div><div class="it-meta"><span class="pill p-acc">${FMT[it.fmt]}</span><span>${esc(blockSum(it))}</span></div><div class="small">${(it.ex||[]).map(x=>esc(x.name)+' <span class="muted">'+esc(bexTxt(x))+'</span>').join(', ')||'<span class="muted">Вправ немає</span>'}</div><button class="btn" data-a="tb-edit" data-n="${i}">Налаштувати блок</button></div>`;const e=ex(it.exId)||{name:'(вправу видалено)',type:'weight'};const type=it.type||e.type;const a=`data-f="ti" data-n="${i}"`;
  let fields;if(type==='hiit')fields=`<div class="g3"><label class="field"><span>Раунди</span><input class="in" inputmode="numeric" ${a} data-k="sets" id="ti-s-${i}" value="${esc(it.sets)}"></label><label class="field"><span>Робота, с</span><input class="in" inputmode="numeric" ${a} data-k="work" id="ti-w-${i}" value="${esc(it.work)}"></label><label class="field"><span>Відпоч., с</span><input class="in" inputmode="numeric" ${a} data-k="rest" id="ti-r-${i}" value="${esc(it.rest)}"></label></div>`;
  else if(type==='cardio')fields='';
  else fields=`<div class="g3"><label class="field"><span>Підходи</span><input class="in" inputmode="numeric" ${a} data-k="sets" id="ti-s-${i}" value="${esc(it.sets)}"></label><label class="field"><span>Повтори</span><input class="in" ${a} data-k="reps" id="ti-p-${i}" value="${esc(it.reps)}" placeholder="8-12"></label><label class="field"><span>RIR</span><input class="in" ${a} data-k="rir" id="ti-q-${i}" value="${esc(it.rir)}" placeholder="1-2"></label></div>`;
  const typeSel=STR.includes(e.type)?`<label class="field"><span>Режим</span><select class="in" ${a} data-k="type" id="ti-t-${i}">${STR.map(x=>`<option value="${x}" ${x===type?'selected':''}>${TYPES[x]}${x===e.type?' (осн.)':''}</option>`).join('')}</select></label>`:'';
  return`<div class="ti"><div class="it-head"><button class="tn" data-a="ti-swap" data-n="${i}">${i+1}. ${esc(e.name)}</button><div class="it-tools"><button class="ib" data-a="ti-mv" data-d="-1" data-n="${i}" ${i===0?'disabled':''} aria-label="Вище">↑</button><button class="ib" data-a="ti-mv" data-d="1" data-n="${i}" ${i===t.items.length-1?'disabled':''} aria-label="Нижче">↓</button><button class="ib del" data-a="ti-del" data-n="${i}" aria-label="Видалити">✕</button></div></div>
   ${fields}<div class="g2">${typeSel}<label class="field" ${typeSel?'':'style="grid-column:1/-1"'}><span>Примітка</span><input class="in" ${a} data-k="note" id="ti-n-${i}" value="${esc(it.note)}" placeholder="на ногу, кут лави..."></label></div></div>`}).join('');
 if(!t.items.length)h+=`<p class="empty">У шаблоні ще немає вправ.</p>`;
 return h+`<div class="g2"><button class="btn" data-a="ti-add">+ Додати вправу</button><button class="btn" data-a="tb-add">+ HIIT-блок</button></div><p class="muted small" style="margin:0">Зміни зберігаються одразу. Натисни назву вправи, щоб замінити її іншою.</p>`}
function vCatalog(){const q=(S.ui.catq||'').toLowerCase();
 let h=`<button class="btn pri full" data-a="ex-new">+ Нова вправа</button><input class="in" data-f="catq" id="catq" value="${esc(S.ui.catq||'')}" placeholder="Пошук вправи" type="search">`;

function catalogList(q,act){const by={};S.catalog.filter(e=>!q||e.name.toLowerCase().includes(q)).forEach(e=>{const g=e.type==='cardio'?'Кардіо':e.type==='hiit'?'HIIT':(regionOf(e)||'Без групи');(by[g]=by[g]||[]).push(e)});
 const order=REGIONS.concat(['HIIT','Кардіо','Без групи']);const ks=Object.keys(by).sort((a,b)=>order.indexOf(a)-order.indexOf(b));

 return ks.map(g=>`<div class="gh">${esc(g)}</div><div class="exlist">${by[g].sort((a,b)=>a.name.localeCompare(b.name,'uk')).map(e=>`<button class="exrow" data-a="${act}" data-e="${e.id}"><span>${esc(e.name)}<small>${TYPES[e.type]}${e.uni?' · Л/П':''}${primOf(e).length?' · '+primOf(e).map(musName).join(', '):''}${e.sec&&e.sec.length?' · доп.: '+e.sec.map(musName).join(', '):''}</small></span><span class="muted">›</span></button>`).join('')}</div>`).join('')}

function bandRows(selectable,sel){sel=sel||{};return S.settings.bands.map(b=>`<div class="bandrow ${sel[b.id]?'on':''}" id="brow-${b.id}"><div class="l1"><input type="color" value="${esc(b.hex)}" data-f="band" data-b="${b.id}" data-k="hex" id="bc-${b.id}" aria-label="Колір"><input class="in" data-f="band" data-b="${b.id}" data-k="name" id="bn-${b.id}" value="${esc(b.name)}" aria-label="Назва">${selectable?`<div class="stepper"><button class="ib" data-a="bq" data-b="${b.id}" data-d="-1" aria-label="Менше">−</button><b class="num" id="bq-${b.id}">${sel[b.id]||0}</b><button class="ib" data-a="bq" data-b="${b.id}" data-d="1" aria-label="Більше">+</button></div>`:''}</div>

 return`<section class="card stack"><div class="lbl">Тема</div><div class="seg">${[['auto','Як у системі'],['light','Світла'],['dark','Темна']].map(([k,l])=>`<button class="${t===k?'on':''}" data-a="theme" data-v="${k}">${l}</button>`).join('')}</div></section>
 <section class="card stack"><div class="lbl">Звук таймера</div><label class="chk"><input type="checkbox" data-c="snd" id="set-snd" ${S.settings.sound!==false?'checked':''}>Звук у таймері (також перемикається на екрані таймера)</label>
 <label class="field"><span>Гучність сигналу: <b id="vol-v">${f0((num(S.settings.vol)||1)*100)}%</b></span><input type="range" min="30" max="100" step="5" data-f="vol" id="set-vol" value="${f0((num(S.settings.vol)||1)*100)}"></label>
 <label class="chk"><input type="checkbox" data-c="duck" id="set-duck" ${S.settings.duck!==false?'checked':''}>Приглушувати музику на час сигналу</label>
 <button class="btn" data-a="snd-test">Перевірити звук</button>
 <p class="muted small" style="margin:0">Сигнал не може бути гучнішим за загальну гучність iPhone. Тому він різкий і високий, щоб пробиватися крізь музику, а музика на мить притихає (Safari 16.4 і новіші). Гучність 100% - максимум без спотворень.</p></section>
 <section class="card stack"><div class="lbl">Статистика м’язів</div><div class="seg"><button class="${musFull()?'':'on'}" data-a="musmode" data-v="short">Коротка</button><button class="${musFull()?'on':''}" data-a="musmode" data-v="full">Розширена</button></div><p class="muted small" style="margin:0">Коротка: 13 основних груп, як раніше (груди, спина, дельти, біцепс, трицепс, ноги, ікри, прес). Розширена: групи по зонах плюс розгиначі, ротатори, передпліччя, привідні, і розкриття до окремих м’язів. Вибір м’язів у вправах детальний в обох режимах.</p></section>

 ${S.settings.trx.anchors.map(a=>`<details class="how"><summary>Таблиця рівнів: ${esc(a.name)}</summary><p class="muted small">Рядки - ступні від кріплення (мінус = ноги з іншого боку кріплення, можливо на турніку), стовпці - де висять ручки: пояс, між поясом і коліном, коліно, нижче коліна. Ноги на підвищенні +1.</p><div class="lbl">Тяги</div>${trxGrid(a,'pull')}<div class="lbl" style="margin-top:10px">Жими і віджимання</div>${trxGrid(a,'push')}</details>`).join('')}
 <p class="muted small" style="margin:0">Типові висоти кріплень - заміряй свої. Кут перевіряється програмою iPhone «Рулетка» → «Рівень»: телефон на груди або спину в нижній точці.</p></section>
 <section class="card stack"><div class="lbl">Мої гуми</div><p class="muted small" style="margin:0">Діапазон - від слабкого до повного натягу гуми. Типові значення, зміни під свої. Нові діапазони діють для наступних записів, збережені тренування не перераховуються.</p><div>${bandRows(false)}</div><button class="btn full" data-a="band-add">+ Додати гуму</button></section>
 <section class="card stack"><div class="lbl">Автокопії на цьому пристрої</div><p class="muted small" style="margin:0">Програма щодня сама зберігає копію даних (останні 7). Вони рятують від помилки програми, але не від очищення даних Safari - для цього потрібна копія в iCloud.${PERSIST===true?' Браузер підтвердив постійне зберігання.':''}</p>
 ${snapKeys().map(snapInfo).filter(Boolean).map(x=>`<div class="row between"><span class="small">${dShort(x.date)}.${x.date.slice(0,4)}${x.tag?' <span class="muted">('+esc(x.tag)+')</span>':''} · ${x.n} трен.</span><button class="btn" data-a="snap-restore" data-k="${esc(x.k)}">Відновити</button></div>`).join('')||'<p class="muted small" style="margin:0">Автокопій ще немає.</p>'}</section>
 <section class="card stack"><div class="lbl">Дані</div><p class="muted small" style="margin:0">Усе зберігається лише в цьому браузері на цьому пристрої. Safari може стерти дані сайту, яким давно не користувались. Роби резервну копію хоча б раз на тиждень.</p>

 <section class="card stack"><div class="lbl">Довідка</div>
 <details class="how"><summary>Як зберігаються дані</summary><ul class="small">
  <li><b>Застосунок</b> - це один файл HTML. Він лише показує екрани, твоїх тренувань у ньому немає.</li>
  <li><b>Історія, шаблони, вправи, гуми</b> зберігаються в браузері на телефоні, окремо для кожної адреси сайту.</li>
  <li>Закрити Safari чи перезавантажити телефон можна спокійно, історія лишається.</li>
  <li>Історія зникне, якщо: змінилась адреса сайту; ти очистив дані сайтів у налаштуваннях Safari; Safari сам стер дані сайту, який довго не відкривали. Від останнього захищає іконка на початковому екрані.</li>
  <li>Різні адреси = різні історії (посилання Claude, GitHub, інший браузер). Переносити між ними - через «Резервна копія» → «Відновити».</li></ul></details>
 <details class="how"><summary>Розмістити на GitHub Pages (безкоштовно)</summary><ol class="small">
  <li>Збережи файл застосунку в «Файли» і перейменуй на <b>index.html</b>.</li>
  <li>Зареєструйся на github.com.</li>
  <li>«New repository» → назва, наприклад <b>trening</b> → залиш <b>Public</b> → «Create repository».</li>
  <li>«Add file» → «Upload files» → обери index.html → «Commit changes».</li>
  <li>«Settings» → «Pages» → у «Branch» обери <b>main</b> і папку <b>/ (root)</b> → «Save».</li>
  <li>Через 1-2 хвилини з'явиться адреса <b>логін.github.io/trening</b>.</li>
  <li>Публічним буде лише код застосунку. Тренування на GitHub не потрапляють.</li></ol></details>
 <details class="how"><summary>Встановити на iPhone</summary><ol class="small">
  <li>Відкрий адресу сайту в <b>Safari</b>.</li>
  <li>«Поділитися» → «На початковий екран» → «Додати».</li>
  <li>Запускай тільки з цієї іконки, щоб історія завжди була в одному місці.</li>
  <li>Відкриття HTML-файлу з програми «Файли» показує лише попередній перегляд без кнопок, для роботи він не підходить.</li></ol></details>
 <details class="how"><summary>Оновити застосунок</summary><ol class="small">
  <li>На всякий випадок зроби резервну копію.</li>
  <li>У репозиторії на GitHub: «Add file» → «Upload files» → завантаж новий <b>index.html</b> з тією самою назвою → «Commit changes».</li>
  <li>Через 1-2 хвилини онови сторінку. Історія лишиться, змінюється лише застосунок.</li>
  <li>Не перейменовуй репозиторій і логін: зміниться адреса, і Safari покаже порожню історію.</li></ol></details>
 <details class="how"><summary>Резервні копії в iCloud</summary><ol class="small">
  <li>Раз на тиждень: «Резервна копія» → «Завантажити файл».</li>
  <li>Збережи файл .json в iCloud Drive (за замовчуванням Safari кладе завантаження в iCloud Drive → «Завантаження»).</li>
  <li>Відновити: «Відновити» → «Обрати файл» → обери копію. Поточні дані на цьому пристрої буде замінено.</li>
  <li>Якщо завантаження не спрацювало: «Скопіювати» і встав текст у Нотатки.</li></ol></details>
 <details class="how"><summary>HIIT-блоки і таймер</summary><ul class="small">
  <li><b>Інтервали:</b> робота/відпочинок (30/20, 45/25 або свої) × раунди. Раунд = усі вправи блоку по черзі, між колами можна дати довший відпочинок.</li>
  <li><b>EMOM:</b> інтервал 0:30-3:00 або свій. Усі вправи щоінтервалу або по черзі. Невиконаний інтервал позначай «Не встиг».</li>
  <li><b>AMRAP:</b> максимум кіл за час, рахуй кнопкою «+1 коло», наприкінці впиши зайві повтори.</li>
  <li><b>Кола:</b> задана кількість кіл на час. Після кола тисни «Коло завершено».</li>
  <li>Для кожної вправи: з повторами або лише час, обтяження - гиря, гантель, 2 гантелі, штанга, гума або без ваги.</li>
  <li>Прогрес порівнюється за назвою блоку, тому не змінюй її без потреби.</li>
  <li><b>Зарядка</b> - окреме місце в шаблонах. Шаблони з ним показуються в картці «Зарядка» на екрані «Запис», а записи йдуть в окрему статистику й історію (перемикач «Тренування / Зарядка» в «Історії» та «Аналітиці»). В основні показники вони не потрапляють.</li>
  <li>На iPhone: увімкни звук (не беззвучний режим), вібрації немає. Екран тримається ввімкненим; якщо заблокувати телефон, сигнали не грають, але таймер після повернення покаже правильну фазу.</li></ul></details>
 <details class="how"><summary>Рівні TRX</summary><ul class="small">
  <li>Рівень - шкала 1-10 за кутом тіла: що горизонтальніше, то важче.</li>
  <li>У тягах і жимах навантаження рахується в кг: вага тіла × 0,69 × cos(кут до підлоги). Горизонтально ~69% ваги тіла, 45° ~49%, 60° ~35%, ноги на підвищенні ~73%. Похибка ±10-15%, але щоразу однакова, тож прогрес видно чесно.</li>
  <li>Кут: 78°+ = 1, 70-77° = 2, 63-69° = 3, 55-62° = 4, 48-54° = 5, 40-47° = 6, 32-39° = 7, 22-31° = 8, менше 22° = 9, ноги на підвищенні +1.</li>
  <li>У тягах і жимах рівень рахується з положення: кріплення, висота ручок, ступні до точки опори або «лямки вертикально», коли руки прямо під кріпленням (на турніку). Кут береться у стартовій позиції з прямими руками. Розрахунок наближений (±1 рівень); точніше підлаштуєш вручну, звіривши кут у «Рулетка» → «Рівень».</li>
  <li>Присідання, присідання на одній нозі й випади: навантаження = вага тіла × (1 − допомога рук). Допомога: сильна ~40%, помірна ~25%, легка ~15%, лише баланс ~5%, без рук 0. У випадах передня нога бере ~85%. Точніше - виміряти на підлогових вагах і вписати кг.</li>
  <li>Згинання ніг і підтягування колін - ручний рівень, без кг.</li>
  <li>Прогресія: повтори до верху діапазону → рівень +1 → знову з низу діапазону.</li></ul></details>
 <details class="how"><summary>Новий телефон або передати іншій людині</summary><ul class="small">
  <li><b>Новий телефон:</b> відкрий ту саму адресу, додай іконку, потім «Відновити» з копії в iCloud.</li>
  <li><b>Іншій людині</b> дай адресу сайту або файл застосунку. Свої шаблони передай через «Шаблони» → «Експорт шаблонів»: там немає твоєї історії.</li></ul></details>
 </section>

function defLoadFor(e){if(!e)return'none';if(/^kb_/.test(e.id))return'kb';return{weight:'bar',db1:'db1',db2:'db2',band:'band'}[e.type]||'none'}

function bexKg(x){const w=num(x.w);switch(x.load){case'kb':case'db1':case'bar':return w||0;case'db2':return(w||0)*2;case'band':{const b=band(x.band)||x.bandSnap;return b?bandMid(b):0}}return 0}

function blockSum(b){const c=b.cfg||{},n=(b.ex||[]).length;switch(b.fmt){
 case'int':return`${c.work}/${c.rest} с · раундів: ${c.rounds}${n>1?' · вправи по колу':''}${n>1&&num(c.between)?` · між колами ${c.between} с`:''}`;
 case'emom':return`Кожні ${mmss(num(c.every)||60)} · інтервалів: ${c.n}${n>1?(c.alt?' · вправи по черзі':' · усі вправи щоінтервалу'):''}`;
 case'amrap':return`${c.min} хв, максимум кіл`;

function blockStats(b){const r=b.res||{},c=b.cfg||{},ex=b.ex||[],n=ex.length;const tgt=x=>x.mode==='reps'?(num(x.target)||0):0;let work=0,reps=0,ton=0,has=!!r.done,score=null,out={};
 if(b.fmt==='int'){const R=+c.rounds||0,g=r.reps||{};let any=false;for(let i=0;i<R;i++)for(let e=0;e<n;e++){const v=num((g[i]||{})[e]);if(v!=null){any=true;reps+=v;ton+=v*bexKg(ex[e])}}
  has=has||any;const wd=r.wdone!=null?+r.wdone:(has?R*n:0);work=wd*(+c.work||0);score=reps||null;out={wd}}
 else if(b.fmt==='emom'){const N=+c.n||0,iv=r.iv||{};let done=0;for(let i=0;i<N;i++){const o=iv[i];const ok=o?o.done!==false:has;if(!ok)continue;done++;const list=c.alt?[ex[i%Math.max(1,n)]].filter(Boolean):ex;list.forEach(x=>{const v=(c.alt&&o&&num(o.reps)!=null)?num(o.reps):tgt(x);reps+=v;ton+=v*bexKg(x)})}
  has=has||Object.keys(iv).length>0;work=done*(+c.every||60);out={done,N,pct:N?done/N:null};score=N?done/N*100:null}

  work=has?(+c.min||0)*60:0;out={rounds:R,extra};score=has?R+(per?extra/per:0):null}
 else{const rd=num(r.rounds)!=null?num(r.rounds):(has?+c.rounds||0:0),t=num(r.time);has=has||rd>0||!!t;reps=rd*ex.reduce((s,x)=>s+tgt(x),0);ton=rd*ex.reduce((s,x)=>s+tgt(x)*bexKg(x),0);work=t||0;out={rounds:rd,time:t};score=t||null}

 if(TM.i>=TM.P.length){tmFinish(false);return}
 const np=TM.P[TM.i];beep(np.k==='rest'?900:1800,.45);
 if(np.k==='rest'&&b&&b.fmt==='int'){const x=b.ex[np.e];if(x&&x.mode==='reps'){b.res.reps=b.res.reps||{};const row=b.res.reps[np.r]||(b.res.reps[np.r]={});if(row[np.e]==null&&num(x.target)!=null)row[np.e]=String(x.target)}}
 tmRender()}
function tmFinish(stopped){if(!TM)return;clearInterval(TM.iv);TM.done=true;TM.stopped=stopped;const b=tmB();wake(false);beep(2000,.7);
 if(b){const r=b.res;r.done=true;r.wdone=TM.wdone;
  if(b.fmt==='int'){const n=b.ex.length;r.reps=r.reps||{};for(let k=0;k<TM.wdone;k++){const ri=Math.floor(k/n),e=k%n,x=b.ex[e];if(x&&x.mode==='reps'&&num(x.target)!=null){const row=r.reps[ri]||(r.reps[ri]={});if(row[e]==null)row[e]=String(x.target)}}}
  if(b.fmt==='amrap')r.rounds=String(TM.rounds);
  if(b.fmt==='circ'){r.rounds=String(TM.rounds);if(TM.t0)r.time=Math.round((Date.now()-TM.t0)/1000)}
  save()}
 tmRender()}
function tmClose(){if(TM&&TM.iv)clearInterval(TM.iv);wake(false);TM=null;$('#timerHost').innerHTML='';document.body.classList.remove('tmopen');render()}
function tmExLine(x){return x?`<div class="tm-exn">${esc(x.name)}</div><div class="tm-exs">${esc(bexTxt(x))}</div>`:''}
function tmRender(){const b=tmB();if(!b){tmClose();return}document.body.classList.add('tmopen');const ph=TM.P[TM.i]||{k:'done'};const c=b.cfg,n=b.ex.length;
 if(TM.done){const s=blockStats(b);$('#timerHost').innerHTML=`<div class="tm tm-done"><div class="tm-top"><span>${esc(b.name)}</span><span>${FMT[b.fmt]}</span></div><div class="tm-phase">${TM.stopped?'Зупинено':'Готово!'}</div>${warmAuto()?`<p>Натисни «Готово», і зарядку буде збережено.</p>`:''}
  <div class="tm-sum">${b.fmt==='amrap'?`<div class="g2"><label class="field"><span>Повних кіл</span><input class="cell" inputmode="numeric" data-f="bres" data-i="${b.uid}" data-k="rounds" id="tmf-r" value="${esc(b.res.rounds??'')}"></label><label class="field"><span>+ повторів понад коло</span><input class="cell" inputmode="numeric" data-f="bres" data-i="${b.uid}" data-k="extra" id="tmf-e" value="${esc(b.res.extra??'')}"></label></div>`:''}
  ${b.fmt==='circ'?`<div class="tm-big">${s.rounds} кіл · ${mmss(s.time||0)}</div>`:''}
  <p>Робочих інтервалів: ${TM.wdone}. ${(b.fmt==='int'||b.fmt==='emom')&&b.ex.some(x=>x.mode==='reps')?'Повтори підставлено за ціллю, поправ їх у картці блоку, якщо треба.':''}</p></div>
  <div class="tm-ctl"><button class="btn pri full" data-a="tm-close">Готово</button></div></div>`;return}
 const lab={prep:'Готуйся',work:ph.amrap?'AMRAP':'Робота',rest:ph.btw?'Відпочинок між колами':'Відпочинок',up:'Коло'}[ph.k];
 let prog='';if(b.fmt==='int'&&ph.r!=null)prog=`Раунд ${ph.r+1}/${c.rounds} · вправа ${ph.e+1}/${n}`;else if(b.fmt==='emom'&&ph.iv!=null)prog=`Інтервал ${ph.iv+1}/${c.n}`;else if(b.fmt==='circ'&&ph.r!=null)prog=`Коло ${ph.r+1}/${c.rounds}`;else if(b.fmt==='amrap')prog=`Кіл: <b id="tm-rc">${TM.rounds}</b>`;
 const nextP=TM.P.slice(TM.i+1).find(p=>p.k==='work'||p.k==='up');
 let cur='',extra='';
 if(ph.k==='work'&&b.fmt==='int')cur=tmExLine(b.ex[ph.e]);
 else if(ph.k==='work'&&b.fmt==='emom')cur=c.alt?tmExLine(b.ex[ph.e]):b.ex.map(tmExLine).join('');
 else if(ph.k==='work'||ph.k==='up')cur=`<ol class="tm-list">${b.ex.map(x=>`<li>${esc(x.name)} <span>${esc(bexTxt(x))}</span></li>`).join('')}</ol>`;
 else if(ph.k==='prep'){const f=TM.P.find(p=>p.k==='work'||p.k==='up');cur=b.fmt==='int'||(b.fmt==='emom'&&c.alt)?tmExLine(b.ex[f&&f.e||0]):`<ol class="tm-list">${b.ex.map(x=>`<li>${esc(x.name)} <span>${esc(bexTxt(x))}</span></li>`).join('')}</ol>`}
 if(ph.k==='rest'&&b.fmt==='int'){const x=b.ex[ph.e];if(x&&x.mode==='reps')extra=`<label class="tm-in"><span>Повтори: ${esc(x.name)}</span><input class="cell" inputmode="numeric" data-f="bres" data-i="${b.uid}" data-k="reps" data-r="${ph.r}" data-e="${ph.e}" id="tm-in" value="${esc(((b.res.reps||{})[ph.r]||{})[ph.e]??'')}"></label>`;
  if(nextP&&nextP.e!=null)cur=`<div class="tm-nextl">Далі</div>`+tmExLine(b.ex[nextP.e])}
 if(ph.k==='rest'&&b.fmt==='circ')cur=`<div class="tm-nextl">Далі коло ${ph.r+2}</div>`;
 if(ph.k==='work'&&b.fmt==='emom'){const o=(b.res.iv||{})[ph.iv]||{};const x=c.alt?b.ex[ph.e]:(n===1?b.ex[0]:null);extra=`${x&&x.mode==='reps'?`<label class="tm-in"><span>Повтори в інтервалі</span><input class="cell" inputmode="numeric" data-f="bres" data-i="${b.uid}" data-k="ivreps" data-n="${ph.iv}" id="tm-in" value="${esc(o.reps??'')}" placeholder="${esc(x.target||'')}"></label>`:''}<button class="btn tm-miss ${o.done===false?'on':''}" data-a="tm-miss">${o.done===false?'Позначено: не встиг':'Не встиг'}</button>`}
 if(b.fmt==='amrap'&&ph.k==='work')extra=`<div class="row" style="justify-content:center;flex-wrap:nowrap"><button class="btn tm-rd" data-a="tm-round" data-d="-1" aria-label="Мінус коло">−</button><button class="btn tm-rd tm-rdbig" data-a="tm-round" data-d="1">+1 коло</button></div>`;
 if(ph.k==='up')extra=`<button class="btn tm-rd tm-rdbig full" data-a="tm-skip">Коло завершено</button>`;
 const nx=nextP&&ph.k!=='rest'&&b.fmt==='int'&&nextP.e!=null&&ph.k!=='prep'?`<div class="tm-next">Далі: ${esc((b.ex[nextP.e]||{}).name||'')}</div>`:'';
 $('#timerHost').innerHTML=`<div class="tm tm-${ph.k}"><div class="tm-top"><span>${esc(b.name)}</span><span>${prog}</span></div>
  <div class="tm-phase">${lab}</div><div class="tm-dig num" id="tm-dig"></div>${ph.k==='up'?`<div class="tm-sub" id="tm-tot"></div>`:''}
  <div class="tm-cur">${cur}</div>${nx}<div class="tm-extra">${extra}</div>
  <label class="chk tm-snd"><input type="checkbox" data-c="snd" id="tm-snd" ${S.settings.sound!==false?'checked':''}>Звук</label>
  <div class="tm-ctl"><button class="btn" data-a="tm-pause">${TM.paused?'Продовжити':'Пауза'}</button>${ph.k==='up'?'':'<button class="btn" data-a="tm-skip">Пропустити</button>'}<button class="btn" data-a="tm-stop">Стоп</button></div></div>`;
 tmDigits()}
function tmDigits(){const el=document.getElementById('tm-dig');if(!el||!TM)return;const ph=TM.P[TM.i];if(!ph)return;const now=TM.paused?TM.pauseAt:Date.now();
 if(ph.k==='up'){el.textContent=mmss((now-TM.start)/1000);const t=document.getElementById('tm-tot');if(t&&TM.t0)t.textContent='Загалом '+mmss((now-TM.t0)/1000)}
 else el.textContent=mmss(Math.max(0,Math.ceil(ph.d-(now-TM.start)/1000)))}
Object.assign(ACT,{
 'tm-start'(el){tmStart(el.dataset.i)},
 'tm-pause'(){if(!TM)return;if(TM.paused){const d=Date.now()-TM.pauseAt;TM.start+=d;if(TM.t0)TM.t0+=d;TM.paused=false}else{TM.paused=true;TM.pauseAt=Date.now()}tmRender()},
 'tm-skip'(){if(TM&&!TM.paused)tmNext()},
 'tm-stop'(){if(!TM)return;if(TM.stopAsk){tmFinish(true);return}TM.stopAsk=true;const el=document.querySelector('[data-a=tm-stop]');if(el){el.textContent='Точно стоп?';el.classList.add('danger')}setTimeout(()=>{if(TM)TM.stopAsk=false},3000)},
 'tm-close'(){const auto=warmAuto();tmClose();if(auto){finish();S.ui.tab='log';save();render();window.scrollTo(0,0);toast('Зарядку збережено')}},
 'tm-round'(el){if(!TM)return;TM.rounds=Math.max(0,TM.rounds+ +el.dataset.d);const b=tmB();if(b){b.res.rounds=String(TM.rounds);save()}const rc=document.getElementById('tm-rc');if(rc)rc.textContent=TM.rounds;if(+el.dataset.d>0)beep(1500,.08)},
 'tm-miss'(){const b=tmB();const ph=TM&&TM.P[TM.i];if(!b||!ph||ph.iv==null)return;b.res.iv=b.res.iv||{};const o=b.res.iv[ph.iv]||(b.res.iv[ph.iv]={});o.done=o.done===false?true:false;save();tmRender()},
 'blk-add'(){openBed({kind:'draft-new'})},
 'w-timer'(el){const t=S.templates.find(x=>x.id===el.dataset.t);if(!t)return;const go=()=>{S.draft=newWorkout(t);save();render();const b=S.draft.items.find(i=>i.type==='block');if(b)tmStart(b.uid)};if(S.draft&&draftHasData())confirmSheet('Зараз триває незбережене тренування. Замінити його зарядкою?','Замінити',go);else go()},
 'w-mark'(){const d=todayStr();const q=S.workouts.filter(w=>isWarm(w)&&w.date===d);if(q.length){const quick=q.filter(w=>w.quick);if(!quick.length){toast('Сьогодні вже є записана зарядка. Видалити її можна в історії');return}S.workouts=S.workouts.filter(w=>!(w.quick&&isWarm(w)&&w.date===d))}else{const t=S.templates.find(x=>x.tag===WARM);S.workouts.push({id:uid(),date:d,tplName:t?t.name:'Зарядка',tag:WARM,quick:true,items:[],startedAt:Date.now()})}save();render()},
 'w-stats'(){S.ui.scope='warm';S.ui.tab='stats';save();render();window.scrollTo(0,0)},
 'snd-test'(){audioInit();beep(1200,.15,true);setTimeout(()=>beep(1800,.45,true),400);if(S.settings.sound===false)toast('Звук у таймері вимкнено, це лише перевірка')},
 musmode(el){S.settings.musMode=el.dataset.v;save();render()},
 warmpos(el){S.settings.warmPos=el.dataset.v;save();render()},
 scope(el){S.ui.scope=el.dataset.v;S.ui.exk='';save();render()},
 'blk-edit'(el){const it=itemBy(el.dataset.i);if(it)openBed({kind:'draft',uid:it.uid},it)},
 'tb-add'(){openBed({kind:'tpl-new'})},
 'tb-edit'(el){const t=S.templates.find(x=>x.id===S.ui.editTpl);if(t)openBed({kind:'tpl',n:+el.dataset.n},t.items[+el.dataset.n])},
 'bed-fmt'(el){BED.fmt=el.dataset.v;BED.cfg=Object.assign(blockDefaults(BED.fmt),{});renderBed()},
 'bed-preset'(el){const[w,r]=el.dataset.v.split('/');BED.cfg.work=+w;BED.cfg.rest=+r;renderBed()},
 'bed-every'(el){BED.cfg.every=+el.dataset.v;renderBed()},
 'bed-min'(el){BED.cfg.min=+el.dataset.v;renderBed()},
 'bed-alt'(el){BED.cfg.alt=el.dataset.v==='1';renderBed()},
 'bed-exmode'(el){BED.ex[+el.dataset.n].mode=el.dataset.v;renderBed()},
 'bed-exmv'(el){const i=+el.dataset.n,j=i+ +el.dataset.d;[BED.ex[i],BED.ex[j]]=[BED.ex[j],BED.ex[i]];renderBed()},
 'bed-exdel'(el){BED.ex.splice(+el.dataset.n,1);renderBed()},
 'bed-exadd'(){BEDPICK=true;pickerSheet(e=>{BEDPICK=false;BED.ex.push(bex(e));renderBed()},'Вправа для блоку')},
 'bed-save'(){bedSave()},
 'iv-tog'(el){const b=itemBy(el.dataset.i);if(!b)return;b.res.iv=b.res.iv||{};const i=+el.dataset.n;const o=b.res.iv[i]||(b.res.iv[i]={});const ok=o.done!=null?o.done!==false:!!b.res.done;o.done=!ok;save();render()}
});

/* ========== events ========== */
document.addEventListener('click',e=>{const tb=e.target.closest('[data-tab]');if(tb){S.ui.tab=tb.dataset.tab;save();render();window.scrollTo(0,0);return}
 const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=ACT[el.dataset.a];if(f){e.preventDefault();f(el)}});
document.addEventListener('input',e=>{const el=e.target,f=el.dataset.f;if(!f)return;const v=el.value,k=el.dataset.k;
 if(f==='w'){S.draft[k]=v;save();return}
 if(f==='s'){const it=itemBy(el.dataset.i);if(!it)return;const s=it.sets[+el.dataset.n]||(it.sets[+el.dataset.n]={});s[k]=v;save();const ft=document.getElementById('ft-'+it.uid);if(ft)ft.innerHTML=footTxt(it);return}
 if(f==='tpl'){const t=S.templates.find(x=>x.id===S.ui.editTpl);if(t){t[k]=v;save()}return}
 if(f==='ti'){const t=S.templates.find(x=>x.id===S.ui.editTpl);if(t){t.items[+el.dataset.n][k]=v;save();if(k==='type')render()}return}
 if(f==='set'){S.settings[k]=v;save();return}
 if(f==='bres'){const b=itemBy(el.dataset.i);if(!b)return;const r=b.res||(b.res={});if(k==='reps'){r.reps=r.reps||{};const row=r.reps[el.dataset.r]||(r.reps[el.dataset.r]={});row[el.dataset.e]=v}else if(k==='ivreps'){r.iv=r.iv||{};const o=r.iv[el.dataset.n]||(r.iv[el.dataset.n]={});o.reps=v;if(o.done==null)o.done=true}else if(k==='time')r.time=parseMMSS(v);else r[k]=v;save();const ft=document.getElementById('ft-'+b.uid);if(ft)ft.innerHTML=blockFoot(b);return}
 if(f==='bed'){if(k==='name')BED.name=v;else BED.cfg[k.slice(4)]=v;return}
 if(f==='bedex'){BED.ex[+el.dataset.n][k]=v;return}
 if(f==='vol'){S.settings.vol=(num(v)||100)/100;save();const o=document.getElementById('vol-v');if(o)o.textContent=v+'%';return}
 if(f==='trx'){S.settings.trx[k]=v;save();return}
 if(f==='txkgm'){TX.kgm=v;const it=itemBy(TXCTX.u),bw=bwOf(S.draft||{});const t=document.getElementById('tx-kg');if(t&&it)t.innerHTML=legKgTxt(trxLegKg(it,{w:TX.lvl,assist:TX.assist,man:TX.manual,kgm:v},bw),bw,it);return}
 if(f==='anc'){const a=S.settings.trx.anchors.find(x=>x.id===el.dataset.b);if(a){a[k]=v;save()}return}
 if(f==='band'){const b=band(el.dataset.b);if(!b)return;b[k]=v;if(S.draft)S.draft.items.forEach(it=>(it.sets||[]).forEach(s=>{if(s.band&&s.band.id===b.id)s.band={...b};if(s.bands)s.bands=s.bands.map(x=>x.id===b.id?{...b}:x)}));save();const t=document.getElementById('band-total');if(t)t.innerHTML=bandTotalTxt();return}
 if(f==='exed'){EXED[k]=v;return}
 if(f==='pickq'){$('#picklist').innerHTML=catalogList(v.toLowerCase(),'pick');return}
 if(f==='catq'){S.ui.catq=v;$('#catlist').innerHTML=catalogList(v.toLowerCase(),'ex-edit');return}});
document.addEventListener('change',e=>{const el=e.target,c=el.dataset.c;if(!c)return;
 if(c==='it-type'){const it=itemBy(el.dataset.i);it.type=el.value;if(it.type==='band'){const b=lastBandFor(it.exId);it.sets.forEach(s=>{if(!bandsOf(s).length&&b){s.bands=b.map(x=>({...x}));if(b.bmode)s.bmode=b.bmode;if(b.bstr)s.bstr=b.bstr}})}save();render();return}
 if(c==='w-phase'){S.draft.phase=el.value;if(!S.draft._edit)S.settings.phase=el.value;save();return}
 if(c==='setphase'){S.settings.phase=el.value;save();return}
 if(c==='snd'){S.settings.sound=el.checked;save();if(el.checked){audioInit();beep(1400,.15)}return}
 if(c==='duck'){S.settings.duck=el.checked;save();audioMode();return}
 if(c==='warmon'){S.settings.warmOn=el.checked;if(!el.checked)S.ui.scope='main';save();render();return}
 if(c==='bres-done'){const b=itemBy(el.dataset.i);if(b){b.res=b.res||{};b.res.done=el.checked;save();render()}return}
 if(c==='bedex-load'){BED.ex[+el.dataset.n].load=el.value;renderBed();return}
 if(c==='bedex-band'){BED.ex[+el.dataset.n].band=el.value;return}
 if(c==='it-uni'){const it=itemBy(el.dataset.i);it.uni=el.checked;save();render();return}
 if(c==='ovm'){S.ui.ovm=el.value}else if(c==='ovt'){S.ui.ovt=el.value}else if(c==='exk'){S.ui.exk=el.value;S.ui.exm=''}else if(c==='corr'){S.ui.corr=el.checked}else if(c==='month'){S.ui.month=el.value}
 else if(c==='exed-type'){EXED.type=el.value;renderExEd();return}else if(c==='exed-uni'){EXED.uni=el.checked;return}else if(c==='exed-trxdir'){EXED.trxDir=el.value;return}else if(c==='exed-trxmode'){EXED.trxMode=el.value;delete EXED.trxAngle;renderExEd();return}else if(c==='exed-lunge'){EXED.legShare=el.checked?.85:1;return}
 else if(c==='imp-file'){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(String(r.result));r.onerror=()=>toast('Не вдалося прочитати файл');r.readAsText(f);return}
 else return;save();render()});
setInterval(()=>{if(S.ui.tab==='log'&&S.draft&&!S.draft._edit)$('#tsub').textContent='триває '+Math.max(0,Math.round((Date.now()-S.draft.startedAt)/6e4))+' хв'},30000);

load();render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(v=>{PERSIST=v}).catch(()=>{})}catch(e){}
</script>
