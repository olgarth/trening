<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тренування">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}body{margin:0}</style>
<title>Щоденник тренувань</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column phone app, sticky top bar, fixed bottom tab bar, cards only for exercises and data blocks */
:root{
  --bg:#EFF1EE; --surface:#FFFFFF; --surface2:#E4E7E2; --line:#D3D7D0;
  --fg:#15181B; --muted:#5C636A; --faint:#9AA0A6;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --accent-soft:#DDE5FB;
  --pr:#C8372B; --good:#25804F; --warn:#B57A06; --bad:#BE3B2A;
  --good-soft:#DCEFE3; --warn-soft:#F6EBCF; --bad-soft:#F7DEDA;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Manrope",-apple-system,system-ui,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1012; --surface:#171A1D; --surface2:#21252A; --line:#2D3238;
  --fg:#ECEEEA; --muted:#A0A7AE; --faint:#6B727A;
  --accent:#7398FF; --accent-ink:#0A0F1C; --accent-soft:#1D2A4D;
  --pr:#FF6E61; --good:#55C98E; --warn:#E6B33F; --bad:#F2705C;
  --good-soft:#163222; --warn-soft:#3A2F12; --bad-soft:#3D1D18;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1012; --surface:#171A1D; --surface2:#21252A; --line:#2D3238;
  --fg:#ECEEEA; --muted:#A0A7AE; --faint:#6B727A;
  --accent:#7398FF; --accent-ink:#0A0F1C; --accent-soft:#1D2A4D;
  --pr:#FF6E61; --good:#55C98E; --warn:#E6B33F; --bad:#F2705C;
  --good-soft:#163222; --warn-soft:#3A2F12; --bad-soft:#3D1D18;
  color-scheme:dark;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:14px 10px;margin-inline:-2px}
.top h1{font-size:30px;line-height:1;text-transform:uppercase}
.top .sub{color:var(--muted);font-size:13px;text-align:right}
main{display:flex;flex-direction:column;gap:14px;max-width:720px;margin-inline:auto;min-width:0}
main>*{min-width:0;max-width:100%}
.card,.it,.hint,.prev,.it-meta,.kv{overflow-wrap:anywhere}
.lbl{font-family:var(--f-display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:44px;padding:0 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.full{width:100%}
.btn:disabled{opacity:.4}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;font-size:16px;line-height:1;padding:0}
.ib:disabled{opacity:.3}
.ib.del{color:var(--bad)}
input.in,select.in,textarea.in{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 10px;font-size:16px;min-height:42px}
textarea.in{min-height:64px;resize:vertical}
input.in[type=date]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;text-align:left}
input.in[type=date]::-webkit-date-and-time-value{text-align:left}
.in::placeholder{color:var(--faint)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted);font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px;overflow-x:auto}
.seg button{flex:1 0 auto;border:0;background:transparent;border-radius:9px;min-height:36px;padding:0 12px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:34px;padding:0 12px;font-size:14px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-acc{background:var(--accent-soft);color:var(--accent)} .p-mut{background:var(--surface2);color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:18px 8px;margin:0}

/* template picker */
.tgroup{display:flex;flex-direction:column;gap:8px}
.tpl{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:58px}
.tpl b{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.1;display:block}
.tpl small{color:var(--muted);font-size:12.5px}
.tpl .go{font-family:var(--f-display);font-size:22px;color:var(--accent)}

/* workout head */
.wk-name{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.05;text-transform:uppercase}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:520px){.metrics{grid-template-columns:repeat(4,1fr)}}

/* exercise card */
.it{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.it-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.it-name{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.1;min-width:0}
.it-name .n{color:var(--faint);margin-right:6px}
.it-tools{display:flex;gap:6px;flex:none}
.it-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}
.it-meta select{border:1px solid var(--line);background:var(--surface2);border-radius:8px;font-size:16px;padding:4px 6px;max-width:100%}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:600;color:var(--fg)}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:8px;padding:5px 9px}
.prev{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prev b{color:var(--fg);font-weight:600}
.sets{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:22px 1.15fr 1.15fr .8fr .9fr;gap:6px;align-items:center}
.srow.h{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.srow.h4{grid-template-columns:22px 1fr 1fr 1fr 1fr}
.srow .i{font-family:var(--f-display);color:var(--faint);font-size:17px;text-align:center}
.cell{width:100%;min-width:0;height:42px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;text-align:center;font:600 18px var(--f-display);font-variant-numeric:tabular-nums;padding:0 2px}
.cell::placeholder{color:var(--faint);font-weight:500}
.lr{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.lr .cell{font-size:17px}
.bandbtn{height:42px;width:100%;min-width:0;border:1px solid var(--line);background:var(--surface2);border-radius:10px;display:flex;align-items:center;gap:5px;padding:0 6px;font-size:13px;font-weight:600;overflow:hidden}
.bandbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 1.5px var(--surface),0 0 0 2.5px var(--line)}
.it-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
.it-foot .stat{font-size:13px;color:var(--muted)}
.it-foot .stat b{font-family:var(--f-display);font-size:18px;color:var(--fg);font-weight:700}
.minibtns{display:flex;gap:6px}
.minibtns .btn{min-height:36px;padding:0 10px;font-size:14px}
.cf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cf .cell{height:44px}

/* history */
.hist{display:flex;flex-direction:column;gap:8px}
.hrow{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.hrow .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.hrow .t b{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.1}
.hrow .t span{color:var(--muted);font-size:13px;white-space:nowrap}
.kv{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.kv b{color:var(--fg);font-family:var(--f-display);font-size:16px;font-weight:600}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:520px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi .v{font:700 28px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:600}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600}
.sig{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.sig:first-child{border-top:0}
.sig .pill{flex:none;margin-top:1px}
.chart{position:relative;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;top:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:600;white-space:nowrap;transform:translateX(-50%)}
.ax{fill:var(--muted);font:500 11px var(--f-body)}
.gl{stroke:var(--line);stroke-width:1}
.cl-area{fill:var(--accent);opacity:.1}.cl-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.cl-dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}.chart .hl{stroke:var(--muted);stroke-dasharray:3 3}.chart .hp{fill:none;stroke:var(--fg);stroke-width:2}
.tblw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;font-weight:700;padding:6px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl tr[data-a]{cursor:pointer}
.up{color:var(--good);font-weight:700} .down{color:var(--bad);font-weight:700}
.gbar{display:grid;grid-template-columns:minmax(92px,32%) 1fr 64px;gap:8px;align-items:center;padding:5px 0}
.gbar .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:14px;background:var(--surface2);border-radius:7px;overflow:hidden}
.track .zone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--good) 16%,transparent)}
.track .fill{position:absolute;left:0;top:3px;bottom:3px;border-radius:4px;background:var(--fg)}
.gbar .vv{text-align:right;font:700 17px var(--f-display);font-variant-numeric:tabular-nums}
.gbar .vv small{display:block;font:600 10.5px var(--f-body);color:var(--muted)}
.corr{display:grid;grid-template-columns:1fr 70px;gap:4px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.corr:first-of-type{border-top:0}
.rbar{grid-column:1/-1;height:8px;background:var(--surface2);border-radius:4px;position:relative}
.rbar i{position:absolute;top:0;bottom:0;border-radius:4px}
.rbar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1.5px;background:var(--faint)}
.rep h3{font-size:22px}
.rep .sec{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}

/* templates editor */
.ti{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.ti .tn{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.1;background:none;border:0;padding:0;text-align:left;color:var(--fg)}
.exlist{display:flex;flex-direction:column}
.exrow{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 2px;min-height:48px}
.exrow:first-child{border-top:0}
.exrow small{color:var(--muted);font-size:12px;display:block}
.gh{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--muted);padding:12px 2px 2px}

/* band rows */
.bandrow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.bandrow:first-child{border-top:0}
.bandrow.on{background:var(--accent-soft);border-radius:10px;padding:10px;margin-inline:-4px}
.bandrow .l1{display:flex;gap:8px;align-items:center}
.bandrow input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;border-radius:50%;flex:none}
.bandrow .l2{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.bandrow .l2 .cell{width:68px;height:38px;font-size:16px}
.stepper{display:flex;align-items:center;gap:6px;flex:none}.stepper b{min-width:22px;text-align:center;font-size:20px}
.sheetfoot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--bg);padding:8px 0 calc(18px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-18px - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.bandtotal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.bandbtn .dot+.dot{margin-left:-8px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);min-height:50px;justify-content:center}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:18px 18px 0 0;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-width:720px;margin-inline:auto}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 2px}
.sheet h3{font-size:24px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--accent-soft);font-weight:700;text-decoration:underline}
details.how summary{font-weight:700;cursor:pointer}
details.how ol,details.how ul{padding-left:20px;margin:8px 0 0}
details.how{border-top:1px solid var(--line);padding-top:10px}
details.how:first-of-type{border-top:0;padding-top:0}
details.how summary{min-height:32px;display:list-item}
details.how li{margin-bottom:6px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

</head>
<body>
<header class="top"><h1 id="ttl">Запис</h1><div class="sub" id="tsub"></div></header>
<main id="main"></main>
<nav class="tabs" id="tabs">
  <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M6 9v6M18 9v6M3 11v2M21 11v2M6 12h12"/></svg>Запис</button>
  <button data-tab="hist"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Історія</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M4 19h16M7 16v-4M12 16V7M17 16v-7"/></svg>Аналітика</button>
  <button data-tab="tpl"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>Шаблони</button>
  <button data-tab="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>Налашт.</button>
</nav>
<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
"use strict";
/* ========== constants ========== */
const KEY='trainlog.v1';
const GROUPS=['Груди','Спина','Передня дельта','Середня дельта','Задня дельта','Трапеції','Біцепс','Трицепс','Квадрицепс','Сідниці','Біцепс стегна','Ікри','Прес'];
const TYPES={weight:'Штанга / тренажер',db1:'1 гантель',db2:'2 гантелі',bw:'Власна вага',band:'Гума',trx:'TRX',hiit:'HIIT (раунди)',cardio:'Кардіо'};

/* ========== utils ========== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function uid(){return Math.random().toString(36).slice(2,10)}
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const median=a=>{if(!a.length)return null;const b=a.slice().sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const todayStr=()=>iso(new Date());
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return iso(d)}
function addDays(s,n){const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)}
const nf=(v,dg=0)=>v==null||!isFinite(v)?'—':v.toLocaleString('uk-UA',{maximumFractionDigits:dg,minimumFractionDigits:0});
const f0=v=>nf(v,0), f1=v=>nf(v,1);
const pct=v=>v==null||!isFinite(v)?'—':(v>0?'+':'')+nf(v*100,1)+'%';
const dShort=d=>d?d.slice(8,10)+'.'+d.slice(5,7):'';
const WD=['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];
const MON=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
function dLong(d){const x=new Date(d+'T12:00');return WD[x.getDay()]+', '+dShort(d)+'.'+d.slice(0,4)}
function mmss(sec){if(!sec)return '0:00';sec=Math.round(sec);return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}

let S, CACHE=null;
const HOST_THEME=document.documentElement.getAttribute('data-theme');
function defaults(){return{v:1,seedV:2,settings:{theme:'auto',bw:80,bands:DEFAULT_BANDS.map(b=>({...b})),trx:defTrx()},catalog:seedCatalog(),templates:seedTemplates(),workouts:[],draft:null,ui:{tab:'log',period:90,stab:'ov'}}}
function load(){try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);fix();return}}catch(e){}S=defaults()}
function fix(){const d=defaults(),sv=S.seedV||1;for(const k of Object.keys(d))if(S[k]==null)S[k]=d[k];S.ui=Object.assign({tab:'log',period:90,stab:'ov'},S.ui||{});if(!S.settings.bands)S.settings.bands=d.settings.bands;if(!S.settings.trx)S.settings.trx=defTrx();S.workouts.concat(S.draft?[S.draft]:[]).forEach(w=>w.items.forEach(it=>{if(it.type!=='trx'||trxModeOf(it.exId)!=='angle')return;it.sets.forEach(st=>{if(st.pos&&!st.pos.dir){st.pos.dir=trxDirOf(it.exId);if(!st.man){const c=trxCalc(st.pos);st.ang=c.ang;st.w=String(c.lvl)}}})}));
 if(sv<2){if(!S.catalog.some(e=>e.id==='trx_pistol')){const e=seedCatalog().find(x=>x.id==='trx_pistol');if(e)S.catalog.push(e)}S.seedV=2}}
function save(){CACHE=null;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Браузер не дав зберегти дані. Зроби резервну копію в Налаштуваннях')}}
const ex=id=>S.catalog.find(e=>e.id===id);
const band=id=>S.settings.bands.find(b=>b.id===id);
const sortedW=()=>S.workouts.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.startedAt||0)-(b.startedAt||0));

/* ========== computations ========== */
function imputed(w,k){const v=num(w[k]);if(v!=null)return{v,imp:false};const ws=sortedW();let pool=ws.filter(x=>x.id!==w.id&&x.date<=w.date&&num(x[k])!=null);if(!pool.length)pool=ws.filter(x=>x.id!==w.id&&num(x[k])!=null);if(!pool.length)return{v:null,imp:true};return{v:avg(pool.map(x=>num(x[k]))),imp:true}}
function bwOf(w){const r=imputed(w,'bw');return r.v!=null?r.v:num(S.settings.bw)}
function repsOf(it,s){if(it.uni){const l=num(s.rl),r=num(s.rr);if(l==null&&r==null)return null;return{tot:(l||0)+(r||0),per:l!=null&&r!=null?(l+r)/2:(l??r)}}const r=num(s.r);return r==null?null:{tot:r,per:r}}
const bandsOf=s=>s.bands&&s.bands.length?s.bands:(s.band?[s.band]:[]);
const bandMid=b=>((num(b.min)||0)+(num(b.max)||0))/2;
const bandKg=s=>{const a=bandsOf(s);return a.length?a.reduce((t,b)=>t+bandMid(b),0):null};
function bandLabel(a){if(!a.length)return'гума';const c={};a.forEach(b=>c[b.name]=(c[b.name]||0)+1);return Object.entries(c).map(([n,k])=>k>1?n+'×'+k:n).join('+')}
const LEVEL_ANG={1:82,2:73.5,3:66,4:58.5,5:51,6:43.5,7:35.5,8:27,9:12};
function trxFrac(s){const lv=num(s.w);if(s.pos&&s.pos.el)return .73;let ang=(s.ang!=null&&!s.man)?s.ang:(s.pos&&!s.man&&s.ang===null?85:LEVEL_ANG[lv]);if(lv>=10&&ang==null)return .73;if(ang==null)return null;return .69*Math.cos(ang*Math.PI/180)}
function unitOf(type,exId){return type==='trx'?(trxModeOf(exId)!=='manual'?'кг':'інд.'):E1UNIT[type]}
function baseLoad(it,s,bw){if(it.type==='trx'&&trxModeOf(it.exId)==='leg')return trxLegKg(it,s,bw);if(it.type==='trx'&&trxAngleMode(it)){const f=trxFrac(s);return f&&bw?bw*f:null}switch(it.type){case'weight':case'db1':case'db2':case'trx':return num(s.w);case'bw':return(bw||0)+(num(s.w)||0);case'band':return bandKg(s)}return null}
function volLoad(it,s,bw){if(it.type==='trx'&&trxModeOf(it.exId)==='manual')return null;const L=baseLoad(it,s,bw);if(L==null)return null;return it.type==='db2'?L*2:L}
function e1rm(L,reps,rir){if(!L||!reps)return null;const t=reps+(rir||0);return t<=1?L:L*(1+t/30)}
function setE1(it,s,bw){const R=repsOf(it,s);if(!R||!R.per)return null;return e1rm(baseLoad(it,s,bw),R.per,num(s.rir))}
function setVol(it,s,bw){const R=repsOf(it,s);if(!R)return 0;const L=volLoad(it,s,bw);return L?L*R.tot:0}
function isHard(it,s){if(!STR.includes(it.type))return false;const R=repsOf(it,s);if(!R||!R.tot)return false;const rir=num(s.rir);return rir==null||rir<=4}
/* ---- TRX position model ---- */
function defTrx(){return{height:185,foot:30,anchors:[{id:'bar',name:'Турнік',h:2.4},{id:'wall',name:'Стіна',h:2.2}]}}
const HH={waist:['Пояс','пояс',.58],mid:['Між поясом і коліном','п/к',.43],knee:['Коліно','кол',.285],low:['Нижче коліна','н/к',.14]};
const TRX_PUSH=['trx_push','trx_triceps'];
const trxDirOf=exId=>{const e=ex(exId)||{};return e.trxDir||(TRX_PUSH.includes(exId)?'push':'pull')};
const TRX_DEF={trx_squat:'leg',trx_lunge:'leg',trx_pistol:'leg',trx_legcurl:'manual',trx_knees:'manual'};
function trxModeOf(exId){const e=ex(exId)||{};if(e.trxMode)return e.trxMode;if(e.trxAngle!=null)return e.trxAngle?'angle':'manual';return TRX_DEF[exId]||'angle'}
const trxAngleMode=it=>trxModeOf(it.exId)==='angle';
const ASSIST=[['strong','Сильна',.40,2],['mid','Помірна',.25,4],['light','Легка',.15,6],['bal','Лише баланс',.05,8],['none','Без рук',0,9]];
const legShare=exId=>{const e=ex(exId)||{};return e.legShare!=null?e.legShare:(exId==='trx_lunge'?.85:1)};
function assistOfLevel(l){l=num(l)||5;return l<=3?'strong':l<=5?'mid':l<=7?'light':l<=8?'bal':'none'}
function trxLegKg(it,s,bw){if(num(s.kgm))return num(s.kgm);if(!num(s.w)&&!s.assist)return null;if(!bw)return null;const k=(s.man||!s.assist)?assistOfLevel(s.w):s.assist;const a=ASSIST.find(x=>x[0]===k)||ASSIST[2];return bw*legShare(it.exId)*(1-a[2])}
function trxAngle(pos){const T=S.settings.trx,H=(num(T.height)||185)/100,L=.80*H,a=.37*H;const anc=(T.anchors.find(x=>x.id===pos.anchor)||{});const A=num(pos.ah)||num(anc.h)||2.3;
 const h0=H*HH[pos.hh][2],Sl=A-h0,d=(num(pos.st)||0)*(num(T.foot)||30)/100,sg=pos.dir==='push'?-1:1;if(Sl<=0)return null;
 let tv=null;for(let i=0;i<=336;i++){const t=i/4*Math.PI/180;if(L*Math.sin(t)+sg*a*Math.cos(t)>=h0){tv=i/4;break}}
 if(pos.vert)return tv;if(tv!=null){const r=tv*Math.PI/180,dv=-(L*Math.cos(r)-sg*a*Math.sin(r));if(d<=dv)return tv}
 let best=null;for(let i=1;i<=336;i++){const t=i/4*Math.PI/180;const hx=d+L*Math.cos(t)-sg*a*Math.sin(t),hy=L*Math.sin(t)+sg*a*Math.cos(t);const f=Math.hypot(hx,hy-A)-Sl;if(!best||Math.abs(f)<Math.abs(best[1]))best=[i/4,f]}
 return best&&Math.abs(best[1])<.03&&best[0]<84?best[0]:null}
function angleLevel(x){if(x==null)return 1;for(const[l,v]of[[78,1],[70,2],[63,3],[55,4],[48,5],[40,6],[32,7],[22,8]])if(x>=l)return v;return 9}
function trxCalc(pos){const ang=trxAngle(pos);return{ang,lvl:Math.min(10,angleLevel(ang)+(pos.el?1:0))}}
function posTxt(p){return p?`${HH[p.hh][1]} ${p.vert?'верт':nf(num(p.st)||0,1)+'ст'}${p.el?'+п':''}`:''}
function lastTrxFor(exId){const ws=sortedW();for(let i=ws.length-1;i>=0;i--){const it=ws[i].items.find(x=>x.exId===exId&&x.type==='trx');if(it){const s=it.sets.find(s=>num(s.w));if(s)return{w:s.w,pos:s.pos?{...s.pos}:null,assist:s.assist||null,kgm:s.kgm||''}}}return null}
function trxGrid(anc,dir){const hs=Object.keys(HH);const cell=pos=>{const a=trxAngle(Object.assign({anchor:anc.id,ah:anc.h,dir},pos));return a==null?'<td class="r muted">—</td>':`<td class="r num">${angleLevel(a)}</td>`};
 const vr=hs.map(h=>cell({hh:h,vert:true}));let rows=`<tr><td>Лямки вертикально</td>${vr.join('')}</tr>`;const r=dir==='push'?[-10,3]:[-1,8];
 for(let st=r[0];st<=r[1];st++){const c=hs.map(h=>cell({hh:h,st}));if(c.every(x=>x.includes('—')))continue;if(dir==='push'&&c.every((x,i)=>x===vr[i]||x.includes('—')))continue;rows+=`<tr><td>${st}</td>${c.join('')}</tr>`}
 return`<div class="tblw"><table class="tbl"><thead><tr><th>Ступні</th>${hs.map(h=>`<th class="r">${HH[h][1]}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`}
function setTxt(it,s){const R=it.uni?`${s.rl||'–'}/${s.rr||'–'}`:(s.r||'–');let L='';switch(it.type){case'bw':L=num(s.w)?'+'+s.w:'ВТ';break;case'band':L=bandsOf(s).length>1?'('+bandLabel(bandsOf(s))+')':bandLabel(bandsOf(s));break;case'trx':L='р'+(s.w||'–')+(s.pos?' ['+posTxt(s.pos)+']':s.assist||num(s.kgm)?' ['+[s.assist?(ASSIST.find(x=>x[0]===s.assist)||['','?'])[1].toLowerCase():'',num(s.kgm)?s.kgm+'кг':''].filter(Boolean).join(' ')+']':'');break;default:L=s.w||'–'}return L+'×'+R}
function itemStats(it,bw){
 if(STR.includes(it.type)){let vol=0,best=null,bs=null,hard=0,sets=0;const rests=[];
  it.sets.forEach(s=>{const R=repsOf(it,s);if(!R||!R.tot)return;sets++;vol+=setVol(it,s,bw);const e=setE1(it,s,bw);if(e!=null&&(best==null||e>best)){best=e;bs=s}if(isHard(it,s))hard++;const r=num(s.rest);if(r)rests.push(r)});
  return{has:sets>0,sets,vol,score:best,bestTxt:bs?setTxt(it,bs):'',hard,rest:avg(rests)}}
 if(it.type==='hiit'){let work=0,reps=0,ton=0,rounds=0;const rests=[];it.sets.forEach(s=>{const wk=num(s.work),r=num(s.r),kg=num(s.w);if(!wk&&!r)return;rounds++;work+=wk||0;reps+=r||0;ton+=(kg||0)*(r||0);const rs=num(s.rest);if(rs)rests.push(rs)});return{has:rounds>0,rounds,work,reps,ton,vol:ton,hard:0,rest:avg(rests)}}
 if(it.type==='cardio'){const s=it.sets[0]||{};const t=num(s.time),d=num(s.dist);if(!t&&!d)return{has:false};return{has:true,time:t,dist:d,kcal:num(s.kcal),hr:num(s.hr),watts:num(s.watts),rpe:num(s.rpe),pace:t&&d?t/d:null,vol:0,hard:0}}
 return{has:false}}
function wStats(w){const bw=bwOf(w);let vol=0,hard=0,exn=0;const groups={};w.items.forEach(it=>{const st=itemStats(it,bw);if(!st.has)return;exn++;vol+=st.vol||0;hard+=st.hard||0;if(st.hard){if(it.group)groups[it.group]=(groups[it.group]||0)+st.hard;(it.sec||[]).forEach(g=>groups[g]=(groups[g]||0)+st.hard*.5)}});return{vol,hard,exn,groups}}
const keyOf=it=>it.exId+'|'+it.type;
function calc(){if(CACHE)return CACHE;const ses={},ws=sortedW(),wst={};
 for(const w of ws){const bw=bwOf(w);wst[w.id]=wStats(w);for(const it of w.items){const st=itemStats(it,bw);if(!st.has)continue;const k=keyOf(it);(ses[k]=ses[k]||{k,name:it.name,type:it.type,exId:it.exId,ses:[]}).ses.push(Object.assign({d:w.date,wid:w.id,tag:w.tag,phase:w.phase||''},st))}}
 const types={};Object.values(ses).forEach(o=>{(types[o.exId]=types[o.exId]||new Set()).add(o.type)});
 Object.values(ses).forEach(o=>{o.label=o.name+(types[o.exId].size>1?' · '+TYPES[o.type]:'');const sc=o.ses.map(x=>x.score).filter(x=>x!=null);o.med=median(sc)});
 const perf={};for(const w of ws){const vals=[];for(const it of w.items){const o=ses[keyOf(it)];if(!o||!STR.includes(it.type)||o.ses.length<2||!o.med)continue;const s=o.ses.find(x=>x.wid===w.id);if(s&&s.score)vals.push(s.score/o.med*100)}perf[w.id]=vals.length?avg(vals):null}
 CACHE={ses,ws,wst,perf};return CACHE}
function periodStart(){const p=S.ui.period;return p?daysAgo(p):'0000-00-00'}
function weeksSpan(ws,start){if(!ws.length)return 1;const first=ws[0].date>start?ws[0].date:start;const days=(new Date(todayStr()+'T12:00')-new Date(first+'T12:00'))/864e5+1;return Math.max(1,days/7)}
function groupSets(ws){const C=calc(),g={};ws.forEach(w=>{const st=C.wst[w.id];for(const k in st.groups)g[k]=(g[k]||0)+st.groups[k]});return g}
function pearson(x,y){const n=x.length;if(n<3)return null;const mx=avg(x),my=avg(y);let a=0,b=0,c=0;for(let i=0;i<n;i++){a+=(x[i]-mx)*(y[i]-my);b+=(x[i]-mx)**2;c+=(y[i]-my)**2}return b&&c?a/Math.sqrt(b*c):null}
function prevSession(exId,w){const ws=sortedW();for(let i=ws.length-1;i>=0;i--){const x=ws[i];if(x.id===w.id||x.date>w.date)continue;const item=x.items.find(i=>i.exId===exId);if(item&&item.sets.some(s=>Object.values(s).some(v=>v!==''&&v!=null&&typeof v!=='object')))return{w:x,item}}return null}
function lastBandFor(exId){const ws=sortedW();for(let i=ws.length-1;i>=0;i--){const it=ws[i].items.find(x=>x.exId===exId&&x.type==='band');if(it){const s=it.sets.find(s=>bandsOf(s).length);if(s)return bandsOf(s).map(b=>{const cur=band(b.id);return cur?{...cur}:{...b}})}}return null}
const repMax=r=>{const m=String(r||'').match(/\d+/g);return m?+m[m.length-1]:null};

function makeItem(e,t={}){const type=t.type||e.type;const it={uid:uid(),exId:e.id,name:e.name,type,uni:!!e.uni,group:e.group||'',sec:(e.sec||[]).slice(),cf:e.cf?e.cf.slice():null,tgt:{sets:t.sets||'',reps:t.reps||'',rir:t.rir||'',note:t.note||'',work:t.work||'',rest:t.rest||''},sets:[]};
 const n=type==='cardio'?1:Math.max(1,+t.sets||2);const b=type==='band'?(lastBandFor(e.id)||null):type==='trx'?lastTrxFor(e.id):null;for(let i=0;i<n;i++)it.sets.push(blankSet(it,t,b));return it}
function newWorkout(tpl){const w={id:uid(),date:todayStr(),tplId:tpl?tpl.id:null,tplName:tpl?tpl.name:'Довільне тренування',tag:tpl?tpl.tag:'Інше',tplNote:tpl?tpl.note:'',phase:S.settings.phase||'',sleep:'',well:'',dur:'',bw:'',notes:'',items:[],startedAt:Date.now()};if(tpl)tpl.items.forEach(t=>{const e=ex(t.exId);if(e)w.items.push(makeItem(e,t))});return w}

function prevLine(it,p){const st=itemStats(p.item,bwOf(p.w));let txt='';

function niceStep(r,n){const raw=r/Math.max(1,n);const p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function chart(pts,unit,dg=0){if(!pts.length)return`<p class="empty">Немає даних за цей період</p>`;
 const id='c'+uid(),W=340,H=176,L=42,R=12,Tp=12,B=26;
 const xs=pts.map(p=>+new Date(p.d+'T12:00'));let x0=Math.min(...xs),x1=Math.max(...xs);if(x0===x1){x0-=3*864e5;x1+=3*864e5}
 const ys=pts.map(p=>p.y);let y0=Math.min(...ys),y1=Math.max(...ys);if(y0===y1){const pad=Math.abs(y0)*.1||1;y0-=pad;y1+=pad}
 const st=niceStep(y1-y0,3);y0=Math.floor(y0/st)*st;y1=Math.ceil(y1/st)*st;if(y0===y1)y1=y0+st;
 const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>Tp+(1-(y-y0)/(y1-y0))*(H-Tp-B);
 let g='';for(let v=y0;v<=y1+st/2;v+=st){const yy=Y(v).toFixed(1);g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L-6}" y="${(+yy+4).toFixed(1)}" text-anchor="end">${nf(v,st<1?1:0)}</text>`}
 const P=pts.map((p,i)=>({x:X(xs[i]),y:Y(p.y),d:p.d,v:p.y,lab:p.lab}));
 const line=P.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
 const area=P.length>1?`<path class="cl-area" d="${line} L${P[P.length-1].x.toFixed(1)} ${H-B} L${P[0].x.toFixed(1)} ${H-B} Z"/>`:'';
 const lbls=[P[0]];if(P.length>2)lbls.push(P[Math.floor(P.length/2)]);if(P.length>1)lbls.push(P[P.length-1]);
 const xl=lbls.map((p,i)=>`<text class="ax" x="${p.x.toFixed(1)}" y="${H-6}" text-anchor="${i===0&&lbls.length>1?'start':i===lbls.length-1&&lbls.length>1?'end':'middle'}">${dShort(p.d)}</text>`).join('');
 const dots=P.length<=40?P.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" class="cl-dot"/>`).join(''):'';
 const last=P[P.length-1];
 CH[id]={P,W,unit,dg};
 return`<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Графік">${g}${area}<path class="cl-line" d="${line}"/>${dots}<circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="5" class="cl-dot"/><line class="hl" x1="0" x2="0" y1="${Tp}" y2="${H-B}" visibility="hidden"/><circle class="hp" r="6" visibility="hidden"/>${xl}</svg><div class="tip" hidden></div></div>`}
function attachCharts(){for(const id in CH){const el=document.getElementById(id);if(!el)continue;const c=CH[id],svg=el.querySelector('svg'),tip=el.querySelector('.tip'),hl=el.querySelector('.hl'),hp=el.querySelector('.hp');
 const show=e=>{const r=svg.getBoundingClientRect();const sx=(e.clientX-r.left)/r.width*c.W;let best=c.P[0];c.P.forEach(p=>{if(Math.abs(p.x-sx)<Math.abs(best.x-sx))best=p});
  hl.setAttribute('x1',best.x);hl.setAttribute('x2',best.x);hl.setAttribute('visibility','visible');hp.setAttribute('cx',best.x);hp.setAttribute('cy',best.y);hp.setAttribute('visibility','visible');
  tip.hidden=false;tip.textContent=`${dShort(best.d)} · ${nf(best.v,c.dg)} ${c.unit}${best.lab?' · '+best.lab:''}`;const px=best.x/c.W*r.width;tip.style.left=Math.min(Math.max(px,60),r.width-60)+'px';tip.style.top=(best.y/c.W*r.width-36)+'px'};
 el.addEventListener('pointerdown',show);el.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)show(e)});el.addEventListener('pointerleave',()=>{tip.hidden=true;hl.setAttribute('visibility','hidden');hp.setAttribute('visibility','hidden')})}}
function viewToggle(key){const v=S.ui['v_'+key]||'chart';return`<div class="seg" style="flex:none"><button class="${v==='chart'?'on':''}" data-a="view" data-k="${key}" data-v="chart">Графік</button><button class="${v==='num'?'on':''}" data-a="view" data-k="${key}" data-v="num">Цифри</button></div>`}

const PERIODS=[[30,'1 міс'],[60,'2 міс'],[90,'3 міс'],[180,'6 міс'],[365,'Рік'],[0,'Все']];
function vStats(){const sub=S.ui.stab||'ov';
 let h=`<div class="seg">${[['ov','Огляд'],['ex','Вправи'],['gr','Групи м’язів'],['rep','Місячний звіт']].map(([k,l])=>`<button class="${sub===k?'on':''}" data-a="stab" data-v="${k}">${l}</button>`).join('')}</div>`;

function impStat(ws,k){let n=0;const v=ws.map(w=>{const r=imputed(w,k);if(r.imp&&r.v!=null)n++;return r.v}).filter(x=>x!=null);return{v:avg(v),n}}
function stOverview(){const C=calc(),ws=sortedW().filter(w=>w.date>=periodStart());
 if(!ws.length)return`<p class="empty">У цьому періоді тренувань немає.</p>`;
 const wk=weeksSpan(ws,periodStart());let vol=0,hard=0;ws.forEach(w=>{vol+=C.wst[w.id].vol;hard+=C.wst[w.id].hard});
 const dur=impStat(ws,'dur'),sl=impStat(ws,'sleep'),wl=impStat(ws,'well');
 const imp=n=>n?` <small>≈${n}</small>`:'';
 let h=`<div class="kpis">
  <div class="kpi"><div class="k">Тренувань</div><div class="v">${ws.length} <small>${f1(ws.length/wk)}/тиж</small></div></div>

  <div class="kpi"><div class="k">Обсяг, т</div><div class="v">${f1(vol/1000)}</div></div>
  <div class="kpi"><div class="k">Сер. тривалість, хв</div><div class="v">${f0(dur.v)}${imp(dur.n)}</div></div>
  <div class="kpi"><div class="k">Сон, год</div><div class="v">${f1(sl.v)}${imp(sl.n)}</div></div>
  <div class="kpi"><div class="k">Самопочуття</div><div class="v">${f1(wl.v)}${imp(wl.n)}</div></div></div>`;
 if(dur.n||sl.n||wl.n)h+=`<p class="muted small" style="margin:-4px 0 0">≈N - стільки тренувань без запису, для них взято середнє попередніх.</p>`;
 h+=`<section class="card stack"><div class="lbl">Що потребує уваги</div>${signals(ws)}</section>`;
 const tpls=[...new Set(ws.map(w=>w.tplName))];const tf=S.ui.ovt&&tpls.includes(S.ui.ovt)?S.ui.ovt:'';const m=S.ui.ovm||'vol';
 const MET={vol:['Обсяг','кг',0],hard:['Робочі підходи','підх.',0],dur:['Тривалість','хв',0],dens:['Щільність','кг/хв',0],perf:['Індекс сили','%',1]};
 const pts=ws.filter(w=>!tf||w.tplName===tf).map(w=>{const st=C.wst[w.id];let y=null;
  if(m==='vol')y=st.vol;else if(m==='hard')y=st.hard;else if(m==='dur')y=imputed(w,'dur').v;else if(m==='dens'){const d=imputed(w,'dur').v;y=d?st.vol/d:null}else y=C.perf[w.id];return y==null?null:{d:w.date,y,lab:tf?'':w.tplName}}).filter(Boolean);
 h+=`<section class="card stack"><div class="row between"><div class="lbl">Динаміка тренувань</div>${viewToggle('ov')}</div>
  <div class="g2"><select class="in" data-c="ovm" id="ovm" aria-label="Показник">${Object.entries(MET).map(([k,v])=>`<option value="${k}" ${k===m?'selected':''}>${v[0]}</option>`).join('')}</select>
  <select class="in" data-c="ovt" id="ovt" aria-label="Шаблон"><option value="">Усі тренування</option>${tpls.map(t=>`<option ${t===tf?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
  ${S.ui.v_ov==='num'?numTable(pts,MET[m][1],MET[m][2]):chart(pts,MET[m][1],MET[m][2])}
  ${m==='perf'?'<p class="muted small" style="margin:0">Індекс сили: 1ПМ кожної вправи відносно її медіани за весь час (100% = твій звичний рівень), усереднено по тренуванню. Працює між залом, гумою й турніком, бо кожна вправа порівнюється сама з собою.</p>':''}
  ${m==='dens'?'<p class="muted small" style="margin:0">Щільність = обсяг / тривалість. Зростає, коли робиш більше за той самий час.</p>':''}</section>`;
 const on=!!S.ui.corr;
 h+=`<section class="card stack"><label class="chk"><input type="checkbox" data-c="corr" id="corr" ${on?'checked':''}>Зв’язок із сном, самопочуттям і тривалістю</label>${on?corrBlock(ws):''}</section>`;
 return h}
function corrBlock(ws){const C=calc();const rows=[['sleep','Сон','perf','індекс сили'],['well','Самопочуття','perf','індекс сили'],['sleep','Сон','vol','обсяг'],['well','Самопочуття','vol','обсяг'],['dur','Тривалість','vol','обсяг']];
 let h='';const n0=ws.length;
 rows.forEach(([a,an,b,bn])=>{const x=[],y=[];ws.forEach(w=>{const xa=imputed(w,a).v;const yb=b==='perf'?C.perf[w.id]:C.wst[w.id].vol;if(xa!=null&&yb!=null){x.push(xa);y.push(yb)}});const r=x.length>=5?pearson(x,y):null;
  const s=r==null?(x.length>=5?'значення не змінюються':'мало даних'):Math.abs(r)<.1?'зв’язку немає':Math.abs(r)<.3?'слабкий':Math.abs(r)<.5?'помірний':'сильний';const dir=r==null||Math.abs(r)<.1?'':r>0?', більше → краще':', більше → гірше';
  const wdt=r==null?0:Math.abs(r)*50;h+=`<div class="corr"><div><b>${an}</b> ↔ ${bn}<div class="muted small">${s}${dir} · n=${x.length}</div></div><div class="num" style="text-align:right;font-size:20px;font-weight:700">${r==null?'—':nf(r,2)}</div><div class="rbar"><i style="left:${r<0?50-wdt:50}%;width:${wdt}%;background:${r==null?'transparent':r>0?'var(--good)':'var(--bad)'}"></i></div></div>`});
 return h+`<p class="muted small" style="margin:0">r від −1 до +1. Потрібно щонайменше 5 тренувань, надійно від 10-15. Кореляція показує збіг, а не причину. Пропущені значення замінено середнім.</p>`}
function signals(ws){const C=calc(),out=[],t=todayStr();
 Object.values(C.ses).forEach(o=>{if(!STR.includes(o.type))return;const s=o.ses.filter(x=>x.score);if(s.length<2)return;const last=s[s.length-1];if(last.d<periodStart())return;const before=s.slice(0,-1);const best=Math.max(...before.map(x=>x.score));
  if(last.score>best*1.005&&last.d>=addDays(t,-14))out.push([1,'p-good','Рекорд',`${o.label}: 1ПМ ≈ ${f1(last.score)} (${pct(last.score/best-1)})`]);
  else if(last.score<best*.95)out.push([0,'p-bad','Спад',`${o.label}: ${pct(last.score/best-1)} від найкращого. Перевір сон, відновлення, техніку${last.phase==='deficit'?' Фаза: дефіцит, невеликий спад тут очікуваний':''}`]);
  else if(s.length>=5){const l4=s.slice(-4),pre=s.slice(0,-4);if(pre.length&&Math.max(...l4.map(x=>x.score))<=Math.max(...pre.map(x=>x.score))*1.005)out.push([2,'p-warn','Застій',`${o.label}: 4 сесії без нового максимуму. Зміни діапазон повторень, додай підхід або зроби легкий тиждень`])}});
 const gs=groupSets(ws),wk=weeksSpan(ws,periodStart());if(ws.length>=3){const low=GROUPS.filter(g=>gs[g]&&gs[g]/wk<6).map(g=>`${g} ${f1(gs[g]/wk)}`);if(low.length)out.push([3,'p-warn','Мало',`Підходів на тиждень менше 6: ${low.join(', ')}`]);const zero=GROUPS.filter(g=>!gs[g]);if(zero.length)out.push([4,'p-mut','Не тренуються',zero.join(', ')]);
  const hi=GROUPS.filter(g=>(gs[g]||0)/wk>20).map(g=>`${g} ${f1(gs[g]/wk)}`);if(hi.length)out.push([3,'p-warn','Багато',`Понад 20 підходів на тиждень: ${hi.join(', ')}. Слідкуй за відновленням`])}
 const wl=ws.map(w=>num(w.well)).filter(x=>x!=null);if(wl.length>=6){const l3=avg(wl.slice(-3)),all=avg(wl);if(l3<=all-1.5)out.push([0,'p-bad','Втома',`Самопочуття останніх 3 тренувань ${f1(l3)} проти ${f1(all)} у середньому. Можливо, час розвантажитись`])}
 if(!out.length)return`<p class="muted small" style="margin:0">Нічого тривожного. Сигнали з’являються, коли є щонайменше 2 сесії вправи.</p>`;
 return`<div>${out.sort((a,b)=>a[0]-b[0]).slice(0,8).map(x=>`<div class="sig"><span class="pill ${x[1]}">${x[2]}</span><span class="small">${esc(x[3])}</span></div>`).join('')}</div>`}
function stExercise(){const C=calc(),ps=periodStart();
 const list=Object.values(C.ses).map(o=>({o,s:o.ses.filter(x=>x.d>=ps)})).filter(x=>x.s.length).sort((a,b)=>b.s.length-a.s.length);
 if(!list.length)return`<p class="empty">У цьому періоді вправ немає.</p>`;

 <section class="card stack"><div class="lbl">Довідка</div>
 <details class="how"><summary>Як зберігаються дані</summary><ul class="small">
  <li><b>Застосунок</b> - це один файл HTML. Він лише показує екрани, твоїх тренувань у ньому немає.</li>
  <li><b>Історія, шаблони, вправи, гуми</b> зберігаються в браузері на телефоні, окремо для кожної адреси сайту.</li>
  <li>Закрити Safari чи перезавантажити телефон можна спокійно, історія лишається.</li>
  <li>Історія зникне, якщо: змінилась адреса сайту; ти очистив дані сайтів у налаштуваннях Safari; Safari сам стер дані сайту, який довго не відкривали. Від останнього захищає іконка на початковому екрані.</li>
  <li>Різні адреси = різні історії (посилання Claude, GitHub, інший браузер). Переносити між ними - через «Резервна копія» → «Відновити».</li></ul></details>
 <details class="how"><summary>Розмістити на GitHub Pages (безкоштовно)</summary><ol class="small">
  <li>Збережи файл застосунку в «Файли» і перейменуй на <b>index.html</b>.</li>
  <li>Зареєструйся на github.com.</li>
  <li>«New repository» → назва, наприклад <b>trening</b> → залиш <b>Public</b> → «Create repository».</li>
  <li>«Add file» → «Upload files» → обери index.html → «Commit changes».</li>
  <li>«Settings» → «Pages» → у «Branch» обери <b>main</b> і папку <b>/ (root)</b> → «Save».</li>
  <li>Через 1-2 хвилини з'явиться адреса <b>логін.github.io/trening</b>.</li>
  <li>Публічним буде лише код застосунку. Тренування на GitHub не потрапляють.</li></ol></details>
 <details class="how"><summary>Встановити на iPhone</summary><ol class="small">
  <li>Відкрий адресу сайту в <b>Safari</b>.</li>
  <li>«Поділитися» → «На початковий екран» → «Додати».</li>
  <li>Запускай тільки з цієї іконки, щоб історія завжди була в одному місці.</li>
  <li>Відкриття HTML-файлу з програми «Файли» показує лише попередній перегляд без кнопок, для роботи він не підходить.</li></ol></details>
 <details class="how"><summary>Оновити застосунок</summary><ol class="small">
  <li>На всякий випадок зроби резервну копію.</li>
  <li>У репозиторії на GitHub: «Add file» → «Upload files» → завантаж новий <b>index.html</b> з тією самою назвою → «Commit changes».</li>
  <li>Через 1-2 хвилини онови сторінку. Історія лишиться, змінюється лише застосунок.</li>
  <li>Не перейменовуй репозиторій і логін: зміниться адреса, і Safari покаже порожню історію.</li></ol></details>
 <details class="how"><summary>Резервні копії в iCloud</summary><ol class="small">
  <li>Раз на тиждень: «Резервна копія» → «Завантажити файл».</li>
  <li>Збережи файл .json в iCloud Drive (за замовчуванням Safari кладе завантаження в iCloud Drive → «Завантаження»).</li>
  <li>Відновити: «Відновити» → «Обрати файл» → обери копію. Поточні дані на цьому пристрої буде замінено.</li>
  <li>Якщо завантаження не спрацювало: «Скопіювати» і встав текст у Нотатки.</li></ol></details>
 <details class="how"><summary>Рівні TRX</summary><ul class="small">
  <li>Рівень - шкала 1-10 за кутом тіла: що горизонтальніше, то важче.</li>
  <li>У тягах і жимах навантаження рахується в кг: вага тіла × 0,69 × cos(кут до підлоги). Горизонтально ~69% ваги тіла, 45° ~49%, 60° ~35%, ноги на підвищенні ~73%. Похибка ±10-15%, але щоразу однакова, тож прогрес видно чесно.</li>
  <li>Кут: 78°+ = 1, 70-77° = 2, 63-69° = 3, 55-62° = 4, 48-54° = 5, 40-47° = 6, 32-39° = 7, 22-31° = 8, менше 22° = 9, ноги на підвищенні +1.</li>
  <li>У тягах і жимах рівень рахується з положення: кріплення, висота ручок, ступні до точки опори або «лямки вертикально», коли руки прямо під кріпленням (на турніку). Кут береться у стартовій позиції з прямими руками. Розрахунок наближений (±1 рівень); точніше підлаштуєш вручну, звіривши кут у «Рулетка» → «Рівень».</li>
  <li>Присідання, присідання на одній нозі й випади: навантаження = вага тіла × (1 − допомога рук). Допомога: сильна ~40%, помірна ~25%, легка ~15%, лише баланс ~5%, без рук 0. У випадах передня нога бере ~85%. Точніше - виміряти на підлогових вагах і вписати кг.</li>
  <li>Згинання ніг і підтягування колін - ручний рівень, без кг.</li>
  <li>Прогресія: повтори до верху діапазону → рівень +1 → знову з низу діапазону.</li></ul></details>
 <details class="how"><summary>Новий телефон або передати іншій людині</summary><ul class="small">
  <li><b>Новий телефон:</b> відкрий ту саму адресу, додай іконку, потім «Відновити» з копії в iCloud.</li>
  <li><b>Іншій людині</b> дай адресу сайту або файл застосунку. Свої шаблони передай через «Шаблони» → «Експорт шаблонів»: там немає твоєї історії.</li></ul></details>
 </section>

 'exed-cf'(el){const k=el.dataset.v;const a=EXED.cf||[];EXED.cf=a.includes(k)?a.filter(x=>x!==k):a.concat(k);renderExEd()},
 'exed-save'(){const e=EXED;e.name=(e.name||'').trim();if(!e.name){toast('Впиши назву вправи');return}if(e._new&&S.catalog.some(x=>x.name.toLowerCase()===e.name.toLowerCase())){toast('Вправа з такою назвою вже є');return}
  const fromPick=e._fromPick,isNew=e._new;delete e._new;delete e._fromPick;if(e.type==='cardio'&&!(e.cf&&e.cf.length))e.cf=['time','dist','kcal','hr'];if(e.type!=='cardio')e.cf=null;
  if(isNew)S.catalog.push(e);else{const i=S.catalog.findIndex(x=>x.id===e.id);S.catalog[i]=e}save();
  if(fromPick&&PICK){const cb=PICK;PICK=null;cb(e)}else closeSheet();toast(isNew?'Вправу додано в каталог':'Вправу збережено')},
 'exed-del'(){const id=EXED.id;confirmSheet('Видалити вправу з каталогу? З шаблонів вона теж зникне, історія залишиться','Видалити',()=>{S.catalog=S.catalog.filter(e=>e.id!==id);S.templates.forEach(t=>t.items=t.items.filter(i=>i.exId!==id));save()})},
 theme(el){S.settings.theme=el.dataset.v;save();render()},
 'exp-all'(){const o=JSON.parse(JSON.stringify(S));exportSheet(o,'trenuvannia-kopiia-'+todayStr()+'.json','Резервна копія')},
 async dl(){let dn=null;try{dn=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
  if(dn){try{await dn.save({filename:EXP.fname,data:EXP.txt});toast('Файл збережено. На iPhone обери «Зберегти у Файли» → iCloud Drive')}catch(e){if(e&&e.code==='declined')toast('Збереження скасовано');else if(e&&e.code==='rate_limited')toast('Зачекай кілька секунд і спробуй ще раз');else toast('Тут файл зберегти не вдалося. Натисни «Скопіювати»')}return}
  try{const b=new Blob([EXP.txt],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=EXP.fname;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Якщо файл не з’явився, натисни «Скопіювати»')}catch(e){toast('Завантаження недоступне. Натисни «Скопіювати»')}},
 copy(){copyText(EXP.txt)},
 wipe(){confirmSheet('Скинути все? Історія, власні вправи й шаблони буде видалено','Скинути',()=>{S=defaults();save()})}
};
function copyText(t){const done=()=>toast('Скопійовано');const fb=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();ok?done():toast('Не вдалося скопіювати. Виділи текст вручну')};
 try{navigator.clipboard.writeText(t).then(done,fb)}catch(e){fb()}}

/* ========== events ========== */
document.addEventListener('click',e=>{const tb=e.target.closest('[data-tab]');if(tb){S.ui.tab=tb.dataset.tab;save();render();window.scrollTo(0,0);return}
 const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=ACT[el.dataset.a];if(f){e.preventDefault();f(el)}});
document.addEventListener('input',e=>{const el=e.target,f=el.dataset.f;if(!f)return;const v=el.value,k=el.dataset.k;
 if(f==='w'){S.draft[k]=v;save();return}
 if(f==='s'){const it=itemBy(el.dataset.i);if(!it)return;const s=it.sets[+el.dataset.n]||(it.sets[+el.dataset.n]={});s[k]=v;save();const ft=document.getElementById('ft-'+it.uid);if(ft)ft.innerHTML=footTxt(it);return}
 if(f==='tpl'){const t=S.templates.find(x=>x.id===S.ui.editTpl);if(t){t[k]=v;save()}return}
 if(f==='ti'){const t=S.templates.find(x=>x.id===S.ui.editTpl);if(t){t.items[+el.dataset.n][k]=v;save();if(k==='type')render()}return}
 if(f==='set'){S.settings[k]=v;save();return}
 if(f==='trx'){S.settings.trx[k]=v;save();return}
 if(f==='txkgm'){TX.kgm=v;const it=itemBy(TXCTX.u),bw=bwOf(S.draft||{});const t=document.getElementById('tx-kg');if(t&&it)t.innerHTML=legKgTxt(trxLegKg(it,{w:TX.lvl,assist:TX.assist,man:TX.manual,kgm:v},bw),bw,it);return}
 if(f==='anc'){const a=S.settings.trx.anchors.find(x=>x.id===el.dataset.b);if(a){a[k]=v;save()}return}
 if(f==='band'){const b=band(el.dataset.b);if(!b)return;b[k]=v;if(S.draft)S.draft.items.forEach(it=>it.sets.forEach(s=>{if(s.band&&s.band.id===b.id)s.band={...b};if(s.bands)s.bands=s.bands.map(x=>x.id===b.id?{...b}:x)}));save();const t=document.getElementById('band-total');if(t)t.innerHTML=bandTotalTxt();return}
 if(f==='exed'){EXED[k]=v;return}
 if(f==='pickq'){$('#picklist').innerHTML=catalogList(v.toLowerCase(),'pick');return}
 if(f==='catq'){S.ui.catq=v;$('#catlist').innerHTML=catalogList(v.toLowerCase(),'ex-edit');return}});
document.addEventListener('change',e=>{const el=e.target,c=el.dataset.c;if(!c)return;
 if(c==='it-type'){const it=itemBy(el.dataset.i);it.type=el.value;if(it.type==='band'){const b=lastBandFor(it.exId);it.sets.forEach(s=>{if(!bandsOf(s).length&&b)s.bands=b.map(x=>({...x}))})}save();render();return}
 if(c==='w-phase'){S.draft.phase=el.value;if(!S.draft._edit)S.settings.phase=el.value;save();return}
 if(c==='setphase'){S.settings.phase=el.value;save();return}
 if(c==='it-uni'){const it=itemBy(el.dataset.i);it.uni=el.checked;save();render();return}
 if(c==='ovm'){S.ui.ovm=el.value}else if(c==='ovt'){S.ui.ovt=el.value}else if(c==='exk'){S.ui.exk=el.value;S.ui.exm=''}else if(c==='corr'){S.ui.corr=el.checked}else if(c==='month'){S.ui.month=el.value}
 else if(c==='exed-type'){EXED.type=el.value;renderExEd();return}else if(c==='exed-uni'){EXED.uni=el.checked;return}else if(c==='exed-trxdir'){EXED.trxDir=el.value;return}else if(c==='exed-trxmode'){EXED.trxMode=el.value;delete EXED.trxAngle;renderExEd();return}else if(c==='exed-lunge'){EXED.legShare=el.checked?.85:1;return}
 else if(c==='imp-file'){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(String(r.result));r.onerror=()=>toast('Не вдалося прочитати файл');r.readAsText(f);return}
 else return;save();render()});
setInterval(()=>{if(S.ui.tab==='log'&&S.draft&&!S.draft._edit)$('#tsub').textContent='триває '+Math.max(0,Math.round((Date.now()-S.draft.startedAt)/6e4))+' хв'},30000);

load();render();
</script>
